 dần học được cách tự chăm sóc bản thân.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g3-a18","lv":"a","src":"doc","zh":"学校请一位中国老师给留学生介绍当地的文化和生活习惯。","py":"Xuéxiào qǐng yí wèi Zhōngguó lǎoshī gěi liúxuéshēng jièshào dāngdì de wénhuà hé shēnghuó xíguàn.","vi":"Nhà trường mời một giáo viên Trung Quốc giới thiệu văn hóa và thói quen sinh hoạt địa phương cho du học sinh.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g3-a19","lv":"a","src":"doc","zh":"老板让我们今天下班以前完成工作，如果遇到问题就马上告诉他。","py":"Lǎobǎn ràng wǒmen jīntiān xiàbān yǐqián wánchéng gōngzuò, rúguǒ yùdào wèntí jiù mǎshàng gàosu tā.","vi":"Ông chủ yêu cầu chúng tôi hoàn thành công việc trước giờ tan làm hôm nay; nếu gặp vấn đề thì báo ngay cho ông ấy.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g3-a20","lv":"a","src":"doc","zh":"她请同事替她参加下午的说明会，因为她需要带孩子去看医生。","py":"Tā qǐng tóngshì tì tā cānjiā xiàwǔ de shuōmínghuì, yīnwèi tā xūyào dài háizi qù kàn yīshēng.","vi":"Cô ấy nhờ đồng nghiệp tham dự buổi họp giải thích vào buổi chiều thay mình vì cần đưa con đi khám bệnh.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"g4","n":14,"lesson":"23","zh":"方位词、存在表达及介词 离/从/往","vi":"Phương vị, tồn tại và giới từ 离/从/往","use":"Nhóm này gồm từ chỉ phương hướng/vị trí; ba cách diễn đạt sự tồn tại bằng 在、有、是; và các giới từ 离、从、往.","formula":"Phương vị: danh từ + 上/下/里/外/前/后/左/右(边). Vị trí: người/vật + 在 + nơi chốn. Tồn tại: nơi chốn + 有 + người/vật. Xác định: nơi chốn + 是 + danh từ. Khoảng cách: A + 离 + B + khoảng cách. Điểm xuất phát: 从 + nơi/thời gian + động từ. Hướng: 往 + phương hướng + động từ.","note":"Sau danh từ chỉ địa điểm thường nói 中国、北京, không nói 中国里、北京里. 有 dùng để giới thiệu sự vật tồn tại ở địa điểm; 在 nhấn mạnh vị trí của sự vật đã xác định. 离 nói khoảng cách, 从 nói điểm bắt đầu, 往 nói hướng di chuyển.","cmp":false,"ex":[{"id":"g4-b01","lv":"b","src":"doc","zh":"邮局在学校东边。","py":"Yóujú zài xuéxiào dōngbian.","vi":"Bưu điện ở phía đông trường học.","ch":["邮局","在","学校","东边"],"fp":"。","ord":true,"alt":[]},{"id":"g4-b02","lv":" ":[],"fp":"","ord":false,"alt":[]},{"id":"g4-a19","lv":"a","src":"doc","zh":"请把文件放在桌子右边，不要放到电脑下面，因为我一会儿还要用。","py":"Qǐng bǎ wénjiàn fàng zài zhuōzi yòubian, bú yào fàng dào diànnǎo xiàmiàn, yīnwèi wǒ yíhuìr hái yào yòng.","vi":"Hãy đặt tài liệu bên phải bàn, đừng đặt dưới máy tính vì lát nữa tôi còn dùng.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g4-a20","lv":"a","src":"doc","zh":"村子前边有一条河，河对面是一片树林，很多人周末会去那里散步。","py":"Cūnzi qiánbian yǒu yì tiáo hé, hé duìmiàn shì yí piàn shùlín, hěn duō rén zhōumò huì qù nàli sànbù.","vi":"Phía trước ngôi làng có một con sông, bên kia sông là một khu rừng; nhiều người cuối tuần đến đó đi dạo.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"g5","n":15,"lesson":"24","zh":"能愿动词 会、要、想、能、可以","vi":"Động từ năng nguyện 会/要/想/能/可以","use":"Đứng trước động từ chính để biểu thị năng lực, mong muốn, dự định, nhu cầu, khả năng hoặc sự cho phép.","formula":"S + 会/要/想/能/可以 + động từ (+ tân ngữ). Phủ định: 不会、不想、不能. 可以 (được phép) thường phủ định bằng 不能 (不可以 cũng đúng, hay dùng khi nói về quy định hoặc cấm đoán); 要 (muốn) thường phủ định bằng 不想, 要 (cần/phải) phủ định bằng 不用; 不要 thường mang nghĩa “đừng”. Câu hỏi chính phản: 会不会、想不想、能不能、可不可以 + động từ…","note":"会 thường là kỹ năng đã học; 想 là muốn/mong muốn; 要 có thể là muốn hoặc cần/phải tùy ngữ cảnh; 能 nhấn mạnh năng lực/điều kiện; 可以 nhấn mạnh được phép hoặc có thể; 会 còn có thể biểu thị dự đoán “sẽ” (明天会下雨). 不要 còn có nghĩa \"đừng\" trong câu ngăn cấm/khuyên bảo. Không lặp cả động từ năng nguyện và động từ chính trong dạng câu hỏi chính phản.","cmp":false,"ex":[{"id":"g5-b01","lv":"b","src":"doc","zh":"我会说汉语。","py":"Wǒ huì shuō Hànyǔ.","vi":"Tôi biết nói tiếng Trung.","ch":["我","会","说","汉语"],"fp":"。","ord":true,"alt":[]},{"id":"g5-b02","lv":"b","src":"doc","zh":"他不会开车。","py":"Tā bú huì kāichē.","vi":"Anh ấy không biết lái xe.","ch":["他","不","会","开车"],"fp":"。","ord":true,"alt":[]},{"id":"g5-b03","lv":"b","src":"doc","zh":"你想喝茶吗？","py":"Nǐ xiǎng hē chá ma?","vi":"Bạn muốn uống trà không?","ch":["你","想","喝","茶吗"],"fp":"？","ord":true,"alt":[]},{"id":"g5-b04","lv":"b","src":"doc","zh":"我想去中国旅游。","py":"Wǒ xiǎng qù Zhōngguó lǚyóu.","vi":"Tôi muốn đi du lịch Trung Quốc.","ch":["我","想","去","中国","旅游"],"fp":"。","ord":true,"alt":[]},{"id":"g5-b05","lv":"b","src":"doc","zh":"明天我要上班。","py":"Míngtiān wǒ yào shàngbān.","vi":"Ngày mai tôi phải đi làm.","ch":["明天","我","要","上班"],"fp":"。","ord":true,"alt":["我明天要上班。"]},{"id":"g5-b06","lv":"b","src":"doc","zh":"这里不能抽烟。","py":"Zhèlǐ bù néng chōuyān.","vi":"Ở đây không được hút thuốc.","ch":["这里","不","能","抽烟"],"fp":"。","ord":true,"alt":[]},{"id":"g5-b07","lv":"b","src":"doc","zh":"你可以坐这儿。","py":"Nǐ kěyǐ zuò zhèr.","vi":"Bạn có thể ngồi ở đây.","ch":["你","可以","坐","这儿"],"fp":"。","ord":true,"alt":[]},{"id":"g5-b08","lv":"b","src":"doc","zh":"我今天不能去学校。","py":"Wǒ jīntiān bù néng qù xuéxiào.","vi":"Hôm nay tôi không thể đến trường.","ch":["我","今天","不","能","去","学校"],"fp":"。","ord":true,"alt":["今天我不能去学校。"]},{"id":"g5-b09","lv":"b","src":"doc","zh":"你想不想学太极拳？","py":"Nǐ xiǎng bu xiǎng xué tàijíquán?","vi":"Bạn có muốn học Thái Cực Quyền không?","ch":["你","想","不","想","学","太极拳"],"fp":"？","ord":true,"alt":[]},{"id":"g5-b10","lv":"b","src":"doc","zh":"请大家不要说话。","py":"Qǐng dàjiā bú yào shuōhuà.","vi":"Mời mọi người đừng nói chuyện.","ch":["请","大家","不","要","说话"],"fp":"。","ord":true,"alt":[]},{"id":"g5-a11","lv":"a","src":"doc","zh":"虽然我已经学了两年汉语，但是还不能很流利地跟中国人聊天。","py":"Suīrán wǒ yǐjīng xué le liǎng nián Hànyǔ, dànshì hái bù néng hěn liúlì de gēn Zhōngguó rén liáotiān.","vi":"Mặc dù tôi đã học tiếng Trung hai năm nhưng vẫn chưa thể trò chuyện lưu loát với người Trung Quốc.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g5-a12","lv":"a","src":"doc","zh":"如果你每天坚持练习发音，很快就会发现自己的进步。","py":"Rúguǒ nǐ měitiān jiānchí liànxí fāyīn, hěn kuài jiù huì fāxiàn zìjǐ de jìnbù.","vi":"Nếu bạn kiên trì luyện phát âm mỗi ngày, bạn sẽ nhanh chóng nhận ra sự tiến bộ của mình.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g5-a13","lv":"a","src":"doc","zh":"我今天晚上想先完成报告，然后再和朋友一起去吃饭。","py":"Wǒ jīntiān wǎnshang xiǎng xiān wánchéng bàogào, ránhòu zài hé péngyou yìqǐ qù chīfàn.","vi":"Tối nay tôi muốn hoàn thành báo cáo trước, sau đó mới đi ăn cùng bạn.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g5-a14","lv":"a","src":"doc","zh":"这家医院周末也可以看病，不过最好提前打电话预约。","py":"Zhè jiā yīyuàn zhōumò yě kěyǐ kànbìng, búguò zuì hǎo tíqián dǎ diànhuà yùyuē.","vi":"Bệnh viện này cuối tuần cũng khám bệnh, nhưng tốt nhất nên gọi điện đặt lịch trước.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g5-a15","lv":"a","src":"doc","zh":"他很想参加这次比赛，可是因为工作太忙，所以没有时间准备。","py":"Tā hěn xiǎng cānjiā zhè cì bǐsài, kěshì yīnwèi gōngzuò tài máng, suǒyǐ méiyǒu shíjiān zhǔnbèi.","vi":"Anh ấy rất muốn tham gia cuộc thi lần này, nhưng vì công việc quá bận nên không có thời gian chuẩn bị.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g5-a16","lv":"a","src":"doc","zh":"进入这个房间以前，大家必须先关掉手机，也不能随便拍照。","py":"Jìnrù zhège fángjiān yǐqián, dàjiā bìxū xiān guāndiào shǒujī, yě bù néng suíbiàn pāizhào.","vi":"Trước khi vào căn phòng này, mọi người phải tắt điện thoại và không được tùy tiện chụp ảnh.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g5-a17","lv":"a","src":"doc","zh":"你会不会用这个软件？如果不会，我可以一步一步教你。","py":"Nǐ huì bu huì yòng zhège ruǎnjiàn? Rúguǒ bú huì, wǒ kěyǐ yí bù yí bù jiāo nǐ.","vi":"Bạn có biết dùng phần mềm này không? Nếu không biết, tôi có thể hướng dẫn bạn từng bước.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g5-a18","lv":"a","src":"doc","zh":"为了身体健康，我们应该少吃油炸食品，多吃蔬菜和水果。","py":"Wèile shēntǐ jiànkāng, wǒmen yīnggāi shǎo chī yóuzhá shípǐn, duō chī shūcài hé shuǐguǒ.","vi":"Để có sức khỏe tốt, chúng ta nên ăn ít đồ chiên rán và ăn nhiều rau củ, trái cây.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g5-a19","lv":"a","src":"doc","zh":"如果明天的天气不错，我们就可以带孩子去公园玩儿一整天。","py":"Rúguǒ míngtiān de tiānqì búcuò, wǒmen jiù kěyǐ dài háizi qù gōngyuán wánr yì zhěng tiān.","vi":"Nếu thời tiết ngày mai tốt, chúng tôi có thể đưa con đến công viên chơi cả ngày.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g5-a20","lv":"a","src":"doc","zh":"我本来想自己解决这个问题，但是试了几次以后，还是需要请老师帮忙。","py":"Wǒ běnlái xiǎng zìjǐ jiějué zhège wèntí, dànshì shì le jǐ cì yǐhòu, háishi xūyào qǐng lǎoshī bāngmáng.","vi":"Ban đầu tôi định tự giải quyết vấn đề này, nhưng sau khi thử vài lần, cuối cùng vẫn cần nhờ giáo viên giúp đỡ.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"g6","n":16,"lesson":"25","zh":"状态补语 得","vi":"Bổ ngữ trạng thái với 得","use":"Dùng để miêu tả hoặc đánh giá mức độ, trạng thái, kết quả biểu hiện của hành động. Thành phần bổ ngữ thường là tính từ hoặc cụm tính từ và nối với động từ bằng 得.","formula":"Khẳng định: V + 得 + (很) + tính từ. Phủ định: V + 得 + 不 + tính từ. Chính phản: V + 得 + tính từ + 不 + tính từ. Khi động từ có tân ngữ: S + V + O + V + 得 + bổ ngữ; trong một số ngữ cảnh có thể lược động từ đầu theo cách nói tự nhiên.","note":"得 trong cấu trúc này đọc de (thanh nhẹ), khác 得 dé trong nghĩa \"được/nhận được\". Không đặt tân ngữ trực tiếp sau bổ ngữ 得. Với động từ có tân ngữ, thường nhắc lại động từ trước 得.","cmp":false,"ex":[{"id":"g6-b01","lv":"b","src":"doc","zh":"她唱得很好。","py":"Tā chàng de hěn hǎo.","vi":"Cô ấy hát rất hay.","ch":["她","唱得","很","好"],"fp":"。","ord":true,"alt":[]},{"id":"g6-b02","lv":"b","src":"doc","zh":"我起得很早。","py":"Wǒ qǐ de hěn zǎo.","vi":"Tôi dậy rất sớm.","ch":["我","起得","很","早"],"fp":"。","ord":true,"alt":[]},{"id":"g6-b03","lv":"b","src":"doc","zh":"他跑得很快。","py":"Tā pǎo de hěn kuài.","vi":"Anh ấy chạy rất nhanh.","ch":["他","跑得","很","快"],"fp":"。","ord":true,"alt":[]},{"id":"g6-b04","lv":"b","src":"doc","zh":"你说得很清楚。","py":"Nǐ shuō de hěn qīngchu.","vi":"Bạn nói rất rõ ràng.","ch":["你","说得","很","清楚"],"fp":"。","ord":true,"alt":[]},{"id":"g6-b05","lv":"b","src":"doc","zh":"我汉语说得不好。","py":"Wǒ Hànyǔ shuō de bù hǎo.","vi":"Tôi nói tiếng Trung chưa tốt.","ch":["我","汉语","说得","不","好"],"fp":"。","ord":true,"alt":["汉语我说得不好。"]},{"id":"g6-b06","lv":"b","src":"doc","zh":"她跳舞跳得不错。","py":"Tā tiàowǔ tiào de búcuò.","vi":"Cô ấy nhảy khá tốt.","ch":["她","跳舞","跳得","不错"],"fp":"。","ord":true,"alt":["跳舞她跳得不错。"]},{"id":"g6-b07","lv":"b","src":"doc","zh":"你今天起得早不早？","py":"Nǐ jīntiān qǐ de zǎo bu zǎo?","vi":"Hôm nay bạn dậy có sớm không?","ch":["你","今天","起得","早","不","早"],"fp":"？","ord":true,"alt":["今天你起得早不早？"]},{"id":"g6-b08","lv":"b","src":"doc","zh":"他工作做得很认真。","py":"Tā gōngzuò zuò de hěn rènzhēn.","vi":"Anh ấy làm việc rất nghiêm túc.","ch":["他","工作","做得","很","认真"],"fp":"。","ord":true,"alt":["工作他做得很认真。"]},{"id":"g6-b09","lv":"b","src":"doc","zh":"孩子睡得很香。","py":"Háizi shuì de hěn xiāng.","vi":"Đứa trẻ ngủ rất ngon.","ch":["孩子","睡得","很","香"],"fp":"。","ord":true,"alt":[]},{"id":"g6-b10","lv":"b","src":"doc","zh":"你汉字写得怎么样？","py":"Nǐ Hànzì xiě de zěnmeyàng?","vi":"Bạn viết chữ Hán thế nào?","ch":["你","汉字","写得","怎么样"],"fp":"？","ord":true,"alt":["汉字你写得怎么样？"]},{"id":"g6-a11","lv":"a","src":"doc","zh":"为了准备考试，她每天晚上都复习到很晚，所以最近睡得不太够。","py":"Wèile zhǔnbèi kǎoshì, tā měitiān wǎnshang dōu fùxí dào hěn wǎn, suǒyǐ zuìjìn shuì de bú tài gòu.","vi":"Để chuẩn bị cho kỳ thi, tối nào cô ấy cũng ôn bài đến khuya nên gần đây ngủ không đủ.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g6-a12","lv":"a","src":"doc","zh":"虽然他来中国的时间不长，但是汉语说得越来越自然，汉字也写得越来越好。","py":"Suīrán tā lái Zhōngguó de shíjiān bù cháng, dànshì Hànyǔ shuō de yuèláiyuè zìrán, Hànzì yě xiě de yuèláiyuè hǎo.","vi":"Mặc dù anh ấy đến Trung Quốc chưa lâu nhưng nói tiếng Trung ngày càng tự nhiên, viết chữ Hán cũng ngày càng tốt.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g6-a13","lv":"a","src":"doc","zh":"这位老师讲课讲得很清楚，即使是比较难的语法，学生也能听明白。","py":"Zhè wèi lǎoshī jiǎngkè jiǎng de hěn qīngchu, jíshǐ shì bǐjiào nán de yǔfǎ, xuésheng yě néng tīng míngbai.","vi":"Giáo viên này giảng bài rất rõ ràng, ngay cả ngữ pháp khá khó học sinh cũng có thể nghe hiểu.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g6-a14","lv":"a","src":"doc","zh":"我弟弟做作业做得很认真，不过写字写得比较慢。","py":"Wǒ dìdi zuò zuòyè zuò de hěn rènzhēn, búguò xiězì xiě de bǐjiào màn.","vi":"Em trai tôi làm bài tập rất nghiêm túc, nhưng viết chữ khá chậm.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g6-a15","lv":"a","src":"doc","zh":"昨天晚上外边下着大雨，风也很大，所以我们走路走得特别慢。","py":"Zuótiān wǎnshang wàibian xiàzhe dàyǔ, fēng yě hěn dà, suǒyǐ wǒmen zǒulù zǒu de tèbié màn.","vi":"Tối qua bên ngoài mưa to, gió cũng mạnh nên chúng tôi đi bộ rất chậm.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g6-a16","lv":"a","src":"doc","zh":"这家饭馆的菜做得很好吃，价格也不贵，因此周末来吃饭的人特别多。","py":"Zhè jiā fànguǎn de cài zuò de hěn hǎochī, jiàgé yě bú guì, yīncǐ zhōumò lái chīfàn de rén tèbié duō.","vi":"Món ăn của nhà hàng này nấu rất ngon, giá cũng không đắt nên cuối tuần có rất đông người đến ăn.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g6-a17","lv":"a","src":"doc","zh":"你最近工作忙不忙？看起来你每天都睡得很晚，应该注意休息。","py":"Nǐ zuìjìn gōngzuò máng bu máng? Kàn qǐlái nǐ měitiān dōu shuì de hěn wǎn, yīnggāi zhùyì xiūxi.","vi":"Gần đây công việc của bạn có bận không? Trông bạn ngày nào cũng ngủ muộn, nên chú ý nghỉ ngơi.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g6-a18","lv":"a","src":"doc","zh":"他虽然跑得没有别人快，但是每天坚持锻炼，身体比以前好多了。","py":"Tā suīrán pǎo de méiyǒu biérén kuài, dànshì měitiān jiānchí duànliàn, shēntǐ bǐ yǐqián hǎo duō le.","vi":"Mặc dù anh ấy chạy không nhanh bằng người khác nhưng kiên trì tập luyện mỗi ngày nên sức khỏe tốt hơn trước nhiều.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g6-a19","lv":"a","src":"doc","zh":"请你把这段话读得慢一点儿，这样刚开始学习的同学也能听清楚。","py":"Qǐng nǐ bǎ zhè duàn huà dú de màn yìdiǎnr, zhèyàng gāng kāishǐ xuéxí de tóngxué yě néng tīng qīngchu.","vi":"Bạn hãy đọc đoạn này chậm hơn một chút để những bạn mới bắt đầu học cũng nghe rõ.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g6-a20","lv":"a","src":"doc","zh":"她把事情安排得很周到，不但提前订好了车票，还给每个人准备了地图。","py":"Tā bǎ shìqing ānpái de hěn zhōudào, búdàn tíqián dìng hǎo le chēpiào, hái gěi měi ge rén zhǔnbèi le dìtú.","vi":"Cô ấy sắp xếp mọi việc rất chu đáo, không những đặt vé xe trước mà còn chuẩn bị bản đồ cho từng người.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"g7","n":17,"lesson":"26","zh":"语气助词\"了\" 在句末；再 và 又","vi":"Trợ từ ngữ khí 了 cuối câu; 再 và 又","use":"了 ở cuối câu có thể biểu thị sự việc đã xảy ra, tình huống mới xuất hiện hoặc trạng thái đã thay đổi. Tài liệu cũng trình bày sự khác nhau giữa 再 và 又 khi diễn đạt hành động lặp lại.","formula":"Câu khẳng định: S + … + 了. Hỏi: …了没有？/ …了吗？ Phủ định sự việc đã xảy ra: 没(有) + V, không thêm 了 ở cuối câu. \"还没(有)……呢\" = vẫn chưa… 再 + V: lặp lại trong tương lai/chưa xảy ra; 又 + V: lặp lại đã xảy ra.","note":"Phân biệt 了 cuối câu (ngữ khí/thay đổi tình huống) với 了 sau động từ (động thái hoàn thành). Không dùng 没有…了 để phủ định hành động quá khứ theo mẫu cơ bản trong tài liệu. Thói quen thường xuyên không dùng 了 cuối câu.","cmp":false,"ex":[{"id":"g7-b01","lv":"b","src":"doc","zh":"我回家了。","py":"Wǒ huí jiā le.","vi":"Tôi về nhà rồi.","ch":["我","回","家了"],"fp":"。","ord":true,"alt":[]},{"id":"g7-b02","lv":"b","src":"doc","zh":"他已经睡了。","py":"Tā yǐjīng shuì le.","vi":"Anh ấy ngủ rồi.","ch":["他","已经","睡了"],"fp":"。","ord":true,"alt":[]},{"id":"g7-b03","lv":"b","src":"doc","zh":"饭好了。","py":"Fàn hǎo le.","vi":"Cơm xong rồi.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g7-b04","lv":"b","src":"doc","zh":"她今年二十岁了。","py":"Tā jīnnián èrshí suì le.","vi":"Năm nay cô ấy 20 tuổi rồi.","ch":["她","今年","二十岁了"],"fp":"。","ord":true,"alt":["今年她二十岁了。"]},{"id":"g7-b05","lv":"b","src":"doc","zh":"你吃饭了没有？","py":"Nǐ chīfàn le méiyǒu?","vi":"Bạn ăn cơm chưa?","ch":["你","吃饭了","没有"],"fp":"？","ord":true,"alt":[]},{"id":"g7-b06","lv":"b","src":"doc","zh":"我还没有做完作业呢。","py":"Wǒ hái méiyǒu zuò wán zuòyè ne.","vi":"Tôi vẫn chưa làm xong bài tập.","ch":["我","还","没有","做","完","作业呢"],"fp":"。","ord":true,"alt":[]},{"id":"g7-b07","lv":"b","src":"doc","zh":"昨天我没去商店。","py":"Zuótiān wǒ méi qù shāngdiàn.","vi":"Hôm qua tôi không đi cửa hàng.","ch":["昨天","我","没","去","商店"],"fp":"。","ord":true,"alt":["我昨天没去商店。"]},{"id":"g7-b08","lv":"b","src":"doc","zh":"明天我再来。","py":"Míngtiān wǒ zài lái.","vi":"Ngày mai tôi sẽ đến lại.","ch":["明天","我","再","来"],"fp":"。","ord":true,"alt":["我明天再来。"]},{"id":"g7-b09","lv":"b","src":"doc","zh":"他今天又迟到了。","py":"Tā jīntiān yòu chídào le.","vi":"Hôm nay anh ấy lại đến muộn.","ch":["他","今天","又","迟到了"],"fp":"。","ord":true,"alt":["今天他又迟到了。"]},{"id":"g7-b10","lv":"b","src":"doc","zh":"我昨天看了电影，今天想再看一次。","py":"Wǒ zuótiān kàn le diànyǐng, jīntiān xiǎng zài kàn yí cì.","vi":"Hôm qua tôi xem phim rồi, hôm nay muốn xem lại một lần.","ch":["我","昨天","看了","电影，","今天","想","再","看","一次"],"fp":"。","ord":true,"alt":["昨天我看了电影，今天想再看一次。"]},{"id":"g7-a11","lv":"a","src":"doc","zh":"我刚刚给妈妈打了电话，但是她还没有回我，所以我晚上再打一次。","py":"Wǒ gānggang gěi māma dǎ le diànhuà, dànshì tā hái méiyǒu huí wǒ, suǒyǐ wǒ wǎnshang zài dǎ yí cì.","vi":"Tôi vừa gọi điện cho mẹ nhưng mẹ vẫn chưa trả lời, vì vậy tối tôi sẽ gọi lại lần nữa.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g7-a12","lv":"a","src":"doc","zh":"他上个星期已经来过一次了，今天又来了，说有一件重要的事情要告诉我们。","py":"Tā shàng ge xīngqī yǐjīng lái guo yí cì le, jīntiān yòu lái le, shuō yǒu yí jiàn zhòngyào de shìqing yào gàosu wǒmen.","vi":"Tuần trước anh ấy đã đến một lần, hôm nay lại đến và nói có chuyện quan trọng muốn báo cho chúng tôi.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g7-a13","lv":"a","src":"doc","zh":"外边已经下雨了，我们先在咖啡馆等一会儿，雨停了再出去。","py":"Wàibian yǐjīng xiàyǔ le, wǒmen xiān zài kāfēiguǎn děng yíhuìr, yǔ tíng le zài chūqu.","vi":"Bên ngoài đã mưa rồi, chúng ta đợi một lát trong quán cà phê, mưa tạnh rồi hãy ra ngoài.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g7-a14","lv":"a","src":"doc","zh":"你买的书我已经看完了，如果还有别的资料，可以明天再带给我。","py":"Nǐ mǎi de shū wǒ yǐjīng kàn wán le, rúguǒ hái yǒu bié de zīliào, kěyǐ míngtiān zài dài gěi wǒ.","vi":"Quyển sách bạn mua tôi đã đọc xong rồi, nếu còn tài liệu khác thì ngày mai có thể mang cho tôi.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g7-a15","lv":"a","src":"doc","zh":"他昨天晚上没有来参加聚会，今天又没有来上课，大家都不知道他怎么了。","py":"Tā zuótiān wǎnshang méiyǒu lái cānjiā jùhuì, jīntiān yòu méiyǒu lái shàngkè, dàjiā dōu bù zhīdào tā zěnme le.","vi":"Tối qua anh ấy không đến dự buổi gặp mặt, hôm nay lại không đến lớp, mọi người đều không biết anh ấy bị sao.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g7-a16","lv":"a","src":"doc","zh":"孩子已经睡着了，请你小声一点儿说话，不要把他吵醒了。","py":"Háizi yǐjīng shuìzháo le, qǐng nǐ xiǎoshēng yìdiǎnr shuōhuà, bú yào bǎ tā chǎoxǐng le.","vi":"Đứa trẻ đã ngủ rồi, bạn hãy nói nhỏ một chút, đừng làm bé thức giấc.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g7-a17","lv":"a","src":"doc","zh":"我还没收到公司的邮件呢，等收到以后，我再告诉你最后的结果。","py":"Wǒ hái méi shōudào gōngsī de yóujiàn ne, děng shōudào yǐhòu, wǒ zài gàosu nǐ zuìhòu de jiéguǒ.","vi":"Tôi vẫn chưa nhận được email của công ty, đợi nhận được rồi tôi sẽ báo bạn kết quả cuối cùng.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g7-a18","lv":"a","src":"doc","zh":"这部电影我上个月看过了，不过朋友没看过，所以我愿意再陪他看一次。","py":"Zhè bù diànyǐng wǒ shàng ge yuè kàn guo le, búguò péngyou méi kàn guo, suǒyǐ wǒ yuànyì zài péi tā kàn yí cì.","vi":"Bộ phim này tháng trước tôi đã xem rồi, nhưng bạn tôi chưa xem nên tôi sẵn lòng xem cùng bạn ấy lần nữa.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g7-a19","lv":"a","src":"doc","zh":"最近天气变冷了，早上出门的时候别忘了穿外套，晚上回家也要早点儿休息。","py":"Zuìjìn tiānqì biàn lěng le, zǎoshang chūmén de shíhou bié wàng le chuān wàitào, wǎnshang huí jiā yě yào zǎodiǎnr xiūxi.","vi":"Gần đây thời tiết trở lạnh rồi, sáng ra ngoài đừng quên mặc áo khoác, tối về nhà cũng nên nghỉ ngơi sớm.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g7-a20","lv":"a","src":"doc","zh":"会议已经开始了，如果你现在还没到，就先给负责人打电话说明情况。","py":"Huìyì yǐjīng kāishǐ le, rúguǒ nǐ xiànzài hái méi dào, jiù xiān gěi fùzérén dǎ diànhuà shuōmíng qíngkuàng.","vi":"Cuộc họp đã bắt đầu rồi, nếu bây giờ bạn vẫn chưa đến thì hãy gọi điện cho người phụ trách để giải thích tình hình.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"g8","n":18,"lesson":"27","zh":"动词 + 了 及 因为……所以……","vi":"Hành động hoàn thành 动词+了 và câu nhân quả 因为…所以…","use":"Động từ + 了 biểu thị hành động đã hoàn thành. 因为……所以…… dùng để nêu nguyên nhân và kết quả.","formula":"Hoàn thành: S + V + 了 + tân ngữ có lượng từ/định ngữ. Phủ định: S + 没(有) + V + O. Hỏi: S + V + O + 了没有？/ S + V + 没(有) + V + O？(你吃没吃早饭？) Hoàn thành rồi làm tiếp: S + V1 + 了 + O + 就 + V2 (吃了晚饭就去散步); 了 sau V1 báo hiệu hành động thứ nhất đã hoàn thành. Nhân quả: 因为 + nguyên nhân，(所以) + kết quả。","note":"Khi tân ngữ không có định ngữ, cần chú ý vị trí 了 theo ngữ cảnh; có thể đặt 了 ở cuối câu hoặc dùng thêm vế/hành động tiếp theo như tài liệu nêu. 因为 và 所以 có thể dùng riêng; khi dùng cùng nhau cần bảo đảm quan hệ nguyên nhân–kết quả rõ ràng.","cmp":false,"ex":[{"id":"g8-b01","lv":"b","src":"doc","zh":"我买了一本书。","py":"Wǒ mǎi le yì běn shū.","vi":"Tôi đã mua một quyển sách.","ch":["我","买了","一本","书"],"fp":"。","ord":true,"alt":[]},{"id":"g8-b02","lv":"b","src":"doc","zh":"他喝了一杯茶。","py":"Tā hē le yì bēi chá.","vi":"Anh ấy đã uống một tách trà.","ch":["他","喝了","一杯","茶"],"fp":"。","ord":true,"alt":[]},{"id":"g8-b03","lv":"b","src":"doc","zh":"我没有吃早饭。","py":"Wǒ méiyǒu chī zǎofàn.","vi":"Tôi chưa ăn sáng.","ch":["我","没有","吃","早饭"],"fp":"。","ord":true,"alt":["早饭我没有吃。"]},{"id":"g8-b04","lv":"b","src":"doc","zh":"你做完作业了没有？","py":"Nǐ zuò wán zuòyè le méiyǒu?","vi":"Bạn làm xong bài tập chưa?","ch":["你","做","完","作业了","没有"],"fp":"？","ord":true,"alt":[]},{"id":"g8-b05","lv":"b","src":"doc","zh":"吃了晚饭就去散步。","py":"Chī le wǎnfàn jiù qù sànbù.","vi":"Ăn tối xong thì đi dạo.","ch":["吃了","晚饭","就","去","散步"],"fp":"。","ord":true,"alt":[]},{"id":"g8-b06","lv":"b","src":"doc","zh":"因为下雨，所以我没出去。","py":"Yīnwèi xiàyǔ, suǒyǐ wǒ méi chūqu.","vi":"Vì trời mưa nên tôi không ra ngoài.","ch":["因为","下雨，","所以","我","没","出去"],"fp":"。","ord":true,"alt":[]},{"id":"g8-b07","lv":"b","src":"doc","zh":"因为他生病了，所以没来上课。","py":"Yīnwèi tā shēngbìng le, suǒyǐ méi lái shàngkè.","vi":"Vì anh ấy bị ốm nên không đến lớp.","ch":["因为","他","生病了，","所以","没","来","上课"],"fp":"。","ord":true,"alt":[]},{"id":"g8-b08","lv":"b","src":"doc","zh":"她学习很努力，所以成绩很好。","py":"Tā xuéxí hěn nǔlì, suǒyǐ chéngjì hěn hǎo.","vi":"Cô ấy học rất chăm nên thành tích rất tốt.","ch":["她","学习","很","努力，","所以","成绩","很","好"],"fp":"。","ord":true,"alt":[]},{"id":"g8-b09","lv":"b","src":"doc","zh":"我昨天看了一个电影。","py":"Wǒ zuótiān kàn le yí ge diànyǐng.","vi":"Hôm qua tôi đã xem một bộ phim.","ch":["我","昨天","看了","一个","电影"],"fp":"。","ord":true,"alt":["昨天我看了一个电影。"]},{"id":"g8-b10","lv":"b","src":"doc","zh":"你给妈妈打电话了没有？","py":"Nǐ gěi māma dǎ diànhuà le méiyǒu?","vi":"Bạn gọi điện cho mẹ chưa?","ch":["你","给","妈妈","打","电话了","没有"],"fp":"？","ord":true,"alt":[]},{"id":"g8-a11","lv":"a","src":"doc","zh":"因为今天早上起得太晚，所以我没来得及吃早饭，就直接坐出租车去公司了。","py":"Yīnwèi jīntiān zǎoshang qǐ de tài wǎn, suǒyǐ wǒ méi láidejí chī zǎofàn, jiù zhíjiē zuò chūzūchē qù gōngsī le.","vi":"Vì sáng nay tôi dậy quá muộn nên không kịp ăn sáng, liền bắt taxi đi thẳng đến công ty.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g8-a12","lv":"a","src":"doc","zh":"昨天我在书店买了两本汉语语法书，回家以后马上开始复习今天老师讲的内容。","py":"Zuótiān wǒ zài shūdiàn mǎi le liǎng běn Hànyǔ yǔfǎ shū, huí jiā yǐhòu mǎshàng kāishǐ fùxí jīntiān lǎoshī jiǎng de nèiróng.","vi":"Hôm qua tôi mua hai quyển sách ngữ pháp tiếng Trung ở hiệu sách, về nhà liền bắt đầu ôn nội dung giáo viên giảng hôm nay.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g8-a13","lv":"a","src":"doc","zh":"因为他最近工作压力很大，所以每天晚上回家以后都需要休息一会儿。","py":"Yīnwèi tā zuìjìn gōngzuò yālì hěn dà, suǒyǐ měitiān wǎnshang huí jiā yǐhòu dōu xūyào xiūxi yíhuìr.","vi":"Vì gần đây áp lực công việc của anh ấy rất lớn nên tối nào về nhà anh ấy cũng cần nghỉ ngơi một lát.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g8-a14","lv":"a","src":"doc","zh":"我吃了早饭就出门了，到了车站才发现自己忘了带钱包。","py":"Wǒ chī le zǎofàn jiù chūmén le, dào le chēzhàn cái fāxiàn zìjǐ wàng le dài qiánbāo.","vi":"Tôi ăn sáng xong liền ra khỏi nhà, đến ga mới phát hiện mình quên mang ví.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g8-a15","lv":"a","src":"doc","zh":"因为这家饭店离我们住的地方很近，而且价格也合理，所以我们经常去那里吃饭。","py":"Yīnwèi zhè jiā fàndiàn lí wǒmen zhù de dìfang hěn jìn, érqiě jiàgé yě hélǐ, suǒyǐ wǒmen jīngcháng qù nàli chīfàn.","vi":"Vì nhà hàng này gần nơi chúng tôi ở và giá cả hợp lý nên chúng tôi thường đến đó ăn.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g8-a16","lv":"a","src":"doc","zh":"她已经把申请材料准备好了，但是还没有收到学校的正式通知。","py":"Tā yǐjīng bǎ shēnqǐng cáiliào zhǔnbèi hǎo le, dànshì hái méiyǒu shōudào xuéxiào de zhèngshì tōngzhī.","vi":"Cô ấy đã chuẩn bị xong hồ sơ đăng ký nhưng vẫn chưa nhận được thông báo chính thức của trường.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g8-a17","lv":"a","src":"doc","zh":"因为我以前没有坐过飞机，所以第一次一个人出国的时候感到有一点儿紧张。","py":"Yīnwèi wǒ yǐqián méiyǒu zuò guo fēijī, suǒyǐ dì-yī cì yí ge rén chūguó de shíhou gǎndào yǒu yìdiǎnr jǐnzhāng.","vi":"Vì trước đây tôi chưa từng đi máy bay nên lần đầu xuất ngoại một mình tôi cảm thấy hơi căng thẳng.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g8-a18","lv":"a","src":"doc","zh":"我们看完了老师发的资料以后，又一起讨论了几个不太容易理解的问题。","py":"Wǒmen kàn wán le lǎoshī fā de zīliào yǐhòu, yòu yìqǐ tǎolùn le jǐ ge bú tài róngyì lǐjiě de wèntí.","vi":"Sau khi đọc xong tài liệu giáo viên phát, chúng tôi lại cùng thảo luận vài vấn đề không dễ hiểu lắm.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g8-a19","lv":"a","src":"doc","zh":"因为孩子昨天晚上发烧了，妈妈今天早上带他去了医院，医生检查以后说没有大问题。","py":"Yīnwèi háizi zuótiān wǎnshang fāshāo le, māma jīntiān zǎoshang dài tā qù le yīyuàn, yīshēng jiǎnchá yǐhòu shuō méiyǒu dà wèntí.","vi":"Vì đứa trẻ tối qua bị sốt nên sáng nay mẹ đưa bé đến bệnh viện; sau khi kiểm tra, bác sĩ nói không có vấn đề lớn.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g8-a20","lv":"a","src":"doc","zh":"我本来打算周末去旅行，但是因为朋友临时有事，所以我们决定下个月再去。","py":"Wǒ běnlái dǎsuàn zhōumò qù lǚxíng, dànshì yīnwèi péngyou línshí yǒu shì, suǒyǐ wǒmen juédìng xià ge yuè zài qù.","vi":"Ban đầu tôi định đi du lịch cuối tuần, nhưng vì bạn đột xuất có việc nên chúng tôi quyết định tháng sau mới đi.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"b28","n":19,"lesson":"28","zh":"一……就……","vi":"一……就…… – Vừa… thì / Hễ… là…","use":"Diễn tả hành động thứ hai xảy ra ngay sau khi hành động thứ nhất hoàn tất, hoặc hai hành động có quan hệ gần như tức thời.","formula":"S + 一 + V1 (+ O) + 就 + V2 (+ O).","note":"Hai hành động thường cùng chủ ngữ; 一 đứng trước động từ thứ nhất, 就 đứng trước động từ thứ hai. Không nhầm với 先……再……: 先…再… chỉ thứ tự hai việc, còn 一…就… nhấn mạnh việc sau xảy ra ngay khi việc trước vừa xảy ra (hoặc “hễ… là…”).","cmp":false,"ex":[{"id":"b28-b01","lv":"b","src":"doc","zh":"我一吃完早饭就去学校。","py":"Wǒ yì chī wán zǎofàn jiù qù xuéxiào.","vi":"Tôi vừa ăn sáng xong là đi học ngay.","ch":["我","一","吃完","早饭","就","去","学校"],"fp":"。","ord":true,"alt":[]},{"id":"b28-b02","lv":"b","src":"doc","zh":"他一下课就回家。","py":"Tā yí xiàkè jiù huí jiā.","vi":"Anh ấy vừa tan học là về nhà ngay.","ch":["他","一","下课","就","回","家"],"fp":"。","ord":true,"alt":[]},{"id":"b28-b03","lv":"b","src":"doc","zh":"我一到家就洗澡。","py":"Wǒ yí dào jiā jiù xǐzǎo.","vi":"Tôi vừa về đến nhà là tắm ngay.","ch":["我","一","到","家","就","洗澡"],"fp":"。","ord":true,"alt":[]},{"id":"b28-b04","lv":"b","src":"doc","zh":"妈妈一回来就做饭。","py":"Māma yì huílai jiù zuò fàn.","vi":"Mẹ vừa về là nấu cơm ngay.","ch":["妈妈","一","回来","就","做","饭"],"fp":"。","ord":true,"alt":[]},{"id":"b28-b05","lv":"b","src":"doc","zh":"他一看见老师就问问题。","py":"Tā yí kànjiàn lǎoshī jiù wèn wèntí.","vi":"Anh ấy vừa nhìn thấy giáo viên là hỏi ngay.","ch":["他","一","看见","老师","就","问","问题"],"fp":"。","ord":true,"alt":[]},{"id":"b28-b06","lv":"b","src":"doc","zh":"我一有时间就看书。","py":"Wǒ yì yǒu shíjiān jiù kàn shū.","vi":"Hễ có thời gian là tôi đọc sách.","ch":["我","一","有","时间","就","看","书"],"fp":"。","ord":true,"alt":[]},{"id":"b28-b07","lv":"b","src":"doc","zh":"她一进教室就打开书。","py":"Tā yí jìn jiàoshì jiù dǎkāi shū.","vi":"Cô ấy vừa vào lớp là mở sách ngay.","ch":["她","一","进","教室","就","打开","书"],"fp":"。","ord":true,"alt":[]},{"id":"b28-b08","lv":"b","src":"doc","zh":"天一黑我们就回家。","py":"Tiān yì hēi wǒmen jiù huí jiā.","vi":"Trời vừa tối là chúng tôi về nhà.","ch":["天","一","黑","我们","就","回","家"],"fp":"。","ord":true,"alt":[]},{"id":"b28-b09","lv":"b","src":"doc","zh":"他一听音乐就想跳舞。","py":"Tā yì tīng yīnyuè jiù xiǎng tiàowǔ.","vi":"Anh ấy cứ nghe nhạc là muốn nhảy.","ch":["他","一","听","音乐","就","想","跳舞"],"fp":"。","ord":true,"alt":[]},{"id":"b28-b10","lv":"b","src":"doc","zh":"我一见到朋友就很高兴。","py":"Wǒ yí jiàn dào péngyou jiù hěn gāoxìng.","vi":"Tôi cứ gặp bạn là rất vui.","ch":["我","一","见","到","朋友","就","很","高兴"],"fp":"。","ord":true,"alt":[]},{"id":"b28-a11","lv":"a","src":"doc","zh":"我每天一到公司就先打开电脑，检查邮件，然后开始安排当天的工作。","py":"Wǒ měitiān yí dào gōngsī jiù xiān dǎkāi diànnǎo, jiǎnchá yóujiàn, ránhòu kāishǐ ānpái dàngtiān de gōngzuò.","vi":"Mỗi ngày vừa đến công ty, tôi mở máy tính trước, kiểm tra email rồi bắt đầu sắp xếp công việc trong ngày.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b28-a12","lv":"a","src":"doc","zh":"她一听说朋友生病了，就马上请假去医院看望他。","py":"Tā yì tīngshuō péngyou shēngbìng le, jiù mǎshàng qǐngjià qù yīyuàn kànwàng tā.","vi":"Vừa nghe tin bạn bị ốm, cô ấy lập tức xin nghỉ để đến bệnh viện thăm bạn.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b28-a13","lv":"a","src":"doc","zh":"他一开始学习就非常专心，所以进步很快。","py":"Tā yì kāishǐ xuéxí jiù fēicháng zhuānxīn, suǒyǐ jìnbù hěn kuài.","vi":"Anh ấy vừa bắt đầu học là đã rất tập trung nên tiến bộ rất nhanh.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b28-a14","lv":"a","src":"doc","zh":"他每天一下班就去接孩子，然后带孩子到附近的公园玩一会儿。","py":"Tā měitiān yí xiàbān jiù qù jiē háizi, ránhòu dài háizi dào fùjìn de gōngyuán wán yíhuìr.","vi":"Mỗi ngày vừa tan làm anh ấy đi đón con ngay, sau đó đưa con đến công viên gần nhà chơi một lát.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b28-a15","lv":"a","src":"doc","zh":"我一看到这张照片，就想起了去年跟家人一起旅行的日子。","py":"Wǒ yí kàn dào zhè zhāng zhàopiàn, jiù xiǎngqǐ le qùnián gēn jiārén yìqǐ lǚxíng de rìzi.","vi":"Vừa nhìn thấy bức ảnh này, tôi liền nhớ đến những ngày đi du lịch cùng gia đình năm ngoái.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b28-a16","lv":"a","src":"doc","zh":"如果你一遇到不懂的问题就问老师，学习的时候会少走很多弯路。","py":"Rúguǒ nǐ yí yùdào bù dǒng de wèntí jiù wèn lǎoshī, xuéxí de shíhou huì shǎo zǒu hěn duō wānlù.","vi":"Nếu cứ gặp vấn đề không hiểu là hỏi giáo viên ngay, bạn sẽ tránh được nhiều đường vòng khi học.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b28-a17","lv":"a","src":"doc","zh":"爸爸一回到家就先洗手，然后帮妈妈准备晚饭。","py":"Bàba yì huí dào jiā jiù xiān xǐshǒu, ránhòu bāng māma zhǔnbèi wǎnfàn.","vi":"Bố vừa về đến nhà là rửa tay trước, sau đó giúp mẹ chuẩn bị bữa tối.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b28-a18","lv":"a","src":"doc","zh":"这家店的蛋糕每天早上刚做好，一开门就有很多客人来买。","py":"Zhè jiā diàn de dàngāo měitiān zǎoshang gāng zuò hǎo, yì kāimén jiù yǒu hěn duō kèrén lái mǎi.","vi":"Bánh ở cửa hàng này vừa làm xong mỗi sáng, cửa hàng mở cửa là có rất nhiều khách đến mua.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b28-a19","lv":"a","src":"doc","zh":"他一发现自己写错了答案，就马上改正，并把错误的原因记在本子上。","py":"Tā yì fāxiàn zìjǐ xiě cuò le dá'àn, jiù mǎshàng gǎizhèng, bìng bǎ cuòwù de yuányīn jì zài běnzi shàng.","vi":"Vừa phát hiện mình viết sai đáp án, anh ấy lập tức sửa lại và ghi nguyên nhân sai vào vở.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b28-a20","lv":"a","src":"doc","zh":"我们一到机场就去办理登机手续，办完以后才有时间吃点儿东西。","py":"Wǒmen yí dào jīchǎng jiù qù bànlǐ dēngjī shǒuxù, bàn wán yǐhòu cái yǒu shíjiān chī diǎnr dōngxi.","vi":"Vừa đến sân bay chúng tôi đi làm thủ tục lên máy bay ngay, làm xong mới có thời gian ăn chút gì đó.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"b29","n":20,"lesson":"29","zh":"结果补语","vi":"Bổ ngữ kết quả (做对、做错、听懂、看完…)","use":"Bổ ngữ kết quả đứng sau động từ để cho biết hành động dẫn đến kết quả gì.","formula":"S + V + bổ ngữ kết quả (+ O). Các kết quả thường gặp trong bài tập: 对 (đúng), 错 (sai), 完 (xong), 懂 (hiểu), 到 (đạt/nhận được), 见 (nhìn/nghe thấy). Phủ định: 没(有) + V + bổ ngữ; câu hỏi: V + bổ ngữ + 了没有?","note":"Phân biệt bổ ngữ kết quả (做对了 = đã làm đúng) với bổ ngữ trạng thái (做得对 = cách làm là đúng, xem mục phân biệt) và với bổ ngữ khả năng (听得懂 / 听不懂, 做得完 / 做不完 = có thể / không thể đạt kết quả). 都 đứng trước động từ/cụm vị ngữ để nhấn mạnh toàn bộ các mục đều có đặc điểm đó.","cmp":false,"ex":[{"id":"b29-b01","lv":"b","src":"doc","zh":"我做对了。","py":"Wǒ zuò duì le.","vi":"Tôi làm đúng rồi.","ch":["我","做","对了"],"fp":"。","ord":true,"alt":[]},{"id":"b29-b02","lv":"b","src":"doc","zh":"他写错了一个字。","py":"Tā xiě cuò le yí ge zì.","vi":"Anh ấy viết sai một chữ.","ch":["他","写","错了","一个","字"],"fp":"。","ord":true,"alt":[]},{"id":"b29-b03","lv":"b","src":"doc","zh":"我听懂了。","py":"Wǒ tīng dǒng le.","vi":"Tôi nghe hiểu rồi.","ch":["我","听","懂了"],"fp":"。","ord":true,"alt":[]},{"id":"b29-b04","lv":"b","src":"doc","zh":"她看完了这本书。","py":"Tā kàn wán le zhè běn shū.","vi":"Cô ấy đọc xong quyển sách này rồi.","ch":["她","看","完了","这","本","书"],"fp":"。","ord":true,"alt":[]},{"id":"b29-b05","lv":"b","src":"doc","zh":"你找到钥匙了吗？","py":"Nǐ zhǎo dào yàoshi le ma?","vi":"Bạn tìm thấy chìa khóa chưa?","ch":["你","找","到","钥匙了吗"],"fp":"？","ord":true,"alt":[]},{"id":"b29-b06","lv":"b","src":"doc","zh":"我没听懂老师的话。","py":"Wǒ méi tīng dǒng lǎoshī de huà.","vi":"Tôi không nghe hiểu lời giáo viên.","ch":["我","没","听","懂","老师的","话"],"fp":"。","ord":true,"alt":[]},{"id":"b29-b07","lv":"b","src":"doc","zh":"他看见老师了。","py":"Tā kànjiàn lǎoshī le.","vi":"Anh ấy nhìn thấy giáo viên rồi.","ch":["他","看见","老师了"],"fp":"。","ord":true,"alt":[]},{"id":"b29-b08","lv":"b","src":"doc","zh":"这些题我都做对了。","py":"Zhèxiē tí wǒ dōu zuò duì le.","vi":"Những câu này tôi đều làm đúng rồi.","ch":["这些","题","我","都","做","对了"],"fp":"。","ord":true,"alt":["我这些题都做对了。"]},{"id":"b29-b09","lv":"b","src":"doc","zh":"我还没写完作业。","py":"Wǒ hái méi xiě wán zuòyè.","vi":"Tôi vẫn chưa làm xong bài tập.","ch":["我","还","没","写","完","作业"],"fp":"。","ord":true,"alt":["作业我还没写完。"]},{"id":"b29-b10","lv":"b","src":"doc","zh":"你听清楚了吗？","py":"Nǐ tīng qīngchu le ma?","vi":"Bạn nghe rõ chưa?","ch":["你","听","清楚了吗"],"fp":"？","ord":true,"alt":[]},{"id":"b29-a11","lv":"a","src":"doc","zh":"老师讲得很清楚，所以这次考试的大部分题目我都做对了。","py":"Lǎoshī jiǎng de hěn qīngchu, suǒyǐ zhè cì kǎoshì de dà bùfen tímù wǒ dōu zuò duì le.","vi":"Giáo viên giảng rất rõ nên phần lớn đề trong kỳ thi lần này tôi đều làm đúng.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b29-a12","lv":"a","src":"doc","zh":"我检查了两遍答案，发现有三道题做错了，其他的题都做对了。","py":"Wǒ jiǎnchá le liǎng biàn dá'àn, fāxiàn yǒu sān dào tí zuò cuò le, qítā de tí dōu zuò duì le.","vi":"Tôi đã kiểm tra đáp án hai lượt và phát hiện có ba câu làm sai, những câu còn lại đều làm đúng.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b29-a13","lv":"a","src":"doc","zh":"这篇课文虽然有很多新词，但是我查完词典以后基本上都看懂了。","py":"Zhè piān kèwén suīrán yǒu hěn duō xīn cí, dànshì wǒ chá wán cídiǎn yǐhòu jīběn shàng dōu kàn dǒng le.","vi":"Bài khóa này tuy có nhiều từ mới nhưng sau khi tra từ điển tôi cơ bản đều đọc hiểu.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b29-a14","lv":"a","src":"doc","zh":"他找了半天也没找到自己的手机，最后才发现手机在书包里。","py":"Tā zhǎo le bàntiān yě méi zhǎo dào zìjǐ de shǒujī, zuìhòu cái fāxiàn shǒujī zài shūbāo lǐ.","vi":"Anh ấy tìm mãi vẫn không tìm thấy điện thoại, cuối cùng mới phát hiện điện thoại ở trong cặp.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b29-a15","lv":"a","src":"doc","zh":"请你把老师刚才说的话记下来，免得过一会儿就忘了。","py":"Qǐng nǐ bǎ lǎoshī gāngcái shuō de huà jì xiàlai, miǎnde guò yíhuìr jiù wàng le.","vi":"Bạn hãy ghi lại lời giáo viên vừa nói để tránh lát nữa lại quên.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b29-a16","lv":"a","src":"doc","zh":"这十道题我都做完了，不过还有两道题不太确定，需要再检查一次。","py":"Zhè shí dào tí wǒ dōu zuò wán le, búguò hái yǒu liǎng dào tí bú tài quèdìng, xūyào zài jiǎnchá yí cì.","vi":"Mười câu này tôi đã làm xong hết, nhưng vẫn có hai câu chưa chắc chắn lắm, cần kiểm tra lại một lần.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b29-a17","lv":"a","src":"doc","zh":"如果你没有听清楚老师的要求，可以请他再说一遍，不要随便猜答案。","py":"Rúguǒ nǐ méiyǒu tīng qīngchu lǎoshī de yāoqiú, kěyǐ qǐng tā zài shuō yí biàn, bú yào suíbiàn cāi dá'àn.","vi":"Nếu bạn chưa nghe rõ yêu cầu của giáo viên, có thể nhờ giáo viên nói lại một lần, đừng tùy tiện đoán đáp án.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b29-a18","lv":"a","src":"doc","zh":"我已经把这本书看完了，里面介绍的学习方法对我帮助很大。","py":"Wǒ yǐjīng bǎ zhè běn shū kàn wán le, lǐmian jièshào de xuéxí fāngfǎ duì wǒ bāngzhù hěn dà.","vi":"Tôi đã đọc xong quyển sách này, phương pháp học được giới thiệu bên trong giúp ích cho tôi rất nhiều.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b29-a19","lv":"a","src":"doc","zh":"这些生词我都记住了，但是要想真正会用，还需要在句子里多练习。","py":"Zhèxiē shēngcí wǒ dōu jì zhù le, dànshì yào xiǎng zhēnzhèng huì yòng, hái xūyào zài jùzi lǐ duō liànxí.","vi":"Những từ mới này tôi đều đã ghi nhớ, nhưng muốn thực sự biết sử dụng thì vẫn cần luyện tập nhiều trong câu.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b29-a20","lv":"a","src":"doc","zh":"他终于听明白了老师的解释，也知道自己以前为什么总是做错这类题。","py":"Tā zhōngyú tīng míngbai le lǎoshī de jiěshì, yě zhīdào zìjǐ yǐqián wèishénme zǒngshì zuò cuò zhè lèi tí.","vi":"Cuối cùng anh ấy cũng nghe hiểu lời giải thích của giáo viên và biết vì sao trước đây mình luôn làm sai dạng bài này.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"b30","n":21,"lesson":"30","zh":"动词 + 时量补语","vi":"Động từ + bổ ngữ thời lượng","use":"Bổ ngữ thời lượng cho biết hành động/trạng thái kéo dài bao lâu.","formula":"Cơ bản: S + V + (了) + thời lượng + (了). Nếu tân ngữ là danh từ, thường lặp động từ: S + V + O + V + 了 + thời lượng (学汉语学了两年), hoặc S + V + 了 + thời lượng + 的 + O. Nếu tân ngữ là đại từ chỉ người: S + V + 了 + đại từ + thời lượng (我等了你半个小时). Với tân ngữ danh từ, khi có 了 cuối câu cũng có thể nói: S + V + O + 时量 + 了 (他学汉语两年了).","note":"Câu có 了 cuối câu thường nhấn mạnh tình trạng bắt đầu từ trước và vẫn tiếp tục đến hiện tại: 我在这儿住了两年了. Nếu hành động đã kết thúc, thường không dùng 了 cuối câu theo nghĩa tiếp diễn. Phân biệt thời lượng với thời điểm: 三个小时 = khoảng thời gian; 三点 = thời điểm.","cmp":false,"ex":[{"id":"b30-b01","lv":"b","src":"doc","zh":"我学汉语学了两年。","py":"Wǒ xué Hànyǔ xué le liǎng nián.","vi":"Tôi đã học tiếng Trung hai năm.","ch":["我","学","汉语","学了","两年"],"fp":"。","ord":true,"alt":[]},{"id":"b30-b02","lv":"b","src":"doc","zh":"他在北京住了三个月了。","py":"Tā zài Běijīng zhù le sān ge yuè le.","vi":"Anh ấy đã sống ở Bắc Kinh được ba tháng rồi.","ch":["他","在","北京","住了","三个","月了"],"fp":"。","ord":true,"alt":[]},{"id":"b30-b03","lv":"b","src":"doc","zh":"我等了你半个小时。","py":"Wǒ děng le nǐ bàn ge xiǎoshí.","vi":"Tôi đã đợi bạn nửa tiếng.","ch":["我","等了","你","半个","小时"],"fp":"。","ord":true,"alt":[]},{"id":"b30-b04","lv":"b","src":"doc","zh":"她工作了五年了。","py":"Tā gōngzuò le wǔ nián le.","vi":"Cô ấy đã làm việc được năm năm rồi.","ch":["她","工作了","五年了"],"fp":"。","ord":true,"alt":[]},{"id":"b30-b05","lv":"b","src":"doc","zh":"我在日本住了一年了。","py":"Wǒ zài Rìběn zhù le yì nián le.","vi":"Tôi đã sống ở Nhật Bản được một năm rồi.","ch":["我","在","日本","住了","一年了"],"fp":"。","ord":true,"alt":[]},{"id":"b30-b06","lv":"b","src":"doc","zh":"他学太极拳学了半年。","py":"Tā xué Tàijíquán xué le bàn nián.","vi":"Anh ấy đã học Thái cực quyền nửa năm.","ch":["他","学","太极拳","学了","半年"],"fp":"。","ord":true,"alt":[]},{"id":"b30-b07","lv":"b","src":"doc","zh":"我们认识三年了。","py":"Wǒmen rènshi sān nián le.","vi":"Chúng tôi quen nhau được ba năm rồi.","ch":["我们","认识","三年了"],"fp":"。","ord":true,"alt":[]},{"id":"b30-b08","lv":"b","src":"doc","zh":"她在这家公司工作两个月了。","py":"Tā zài zhè jiā gōngsī gōngzuò liǎng ge yuè le.","vi":"Cô ấy làm việc ở công ty này được hai tháng rồi.","ch":["她","在","这","家","公司","工作","两个","月了"],"fp":"。","ord":true,"alt":[]},{"id":"b30-b09","lv":"b","src":"doc","zh":"我每天练习写一个小时的汉字。","py":"Wǒ měitiān liànxí xiě yí ge xiǎoshí de Hànzì.","vi":"Mỗi ngày tôi luyện viết chữ Hán một tiếng.","ch":["我","每天","练习","写","一个","小时","的","汉字"],"fp":"。","ord":true,"alt":["每天我练习写一个小时的汉字。"]},{"id":"b30-b10","lv":"b","src":"doc","zh":"他已经等了一个多小时了。","py":"Tā yǐjīng děng le yí ge duō xiǎoshí le.","vi":"Anh ấy đã đợi hơn một tiếng rồi.","ch":["他","已经","等了","一个","多","小时了"],"fp":"。","ord":true,"alt":[]},{"id":"b30-a11","lv":"a","src":"doc","zh":"我来日本工作两个多月了，现在已经慢慢习惯了这里的生活和交通。","py":"Wǒ lái Rìběn gōngzuò liǎng ge duō yuè le, xiànzài yǐjīng mànmàn xíguàn le zhèlǐ de shēnghuó hé jiāotōng.","vi":"Tôi đến Nhật Bản làm việc được hơn hai tháng rồi, hiện tại đã dần quen với cuộc sống và giao thông ở đây.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b30-a12","lv":"a","src":"doc","zh":"她在这所大学学习汉语三年了，不但能看懂课文，还可以跟中国人自然地交流。","py":"Tā zài zhè suǒ dàxué xuéxí Hànyǔ sān nián le, búdàn néng kàn dǒng kèwén, hái kěyǐ gēn Zhōngguó rén zìrán de jiāoliú.","vi":"Cô ấy học tiếng Trung ở trường đại học này được ba năm rồi, không những đọc hiểu bài khóa mà còn có thể giao tiếp tự nhiên với người Trung Quốc.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b30-a13","lv":"a","src":"doc","zh":"我们已经在车站等了四十多分钟了，可是火车还没有到。","py":"Wǒmen yǐjīng zài chēzhàn děng le sìshí duō fēnzhōng le, kěshì huǒchē hái méiyǒu dào.","vi":"Chúng tôi đã đợi ở nhà ga hơn 40 phút rồi nhưng tàu vẫn chưa đến.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b30-a14","lv":"a","src":"doc","zh":"他在这家公司工作了五年，去年开始负责一个新的项目。","py":"Tā zài zhè jiā gōngsī gōngzuò le wǔ nián, qùnián kāishǐ fùzé yí ge xīn de xiàngmù.","vi":"Anh ấy đã làm việc ở công ty này năm năm, năm ngoái bắt đầu phụ trách một dự án mới.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b30-a15","lv":"a","src":"doc","zh":"我认识王老师已经十多年了，他一直很认真地帮助学生学习汉语。","py":"Wǒ rènshi Wáng lǎoshī yǐjīng shí duō nián le, tā yìzhí hěn rènzhēn de bāngzhù xuésheng xuéxí Hànyǔ.","vi":"Tôi quen thầy Vương hơn mười năm rồi, thầy luôn tận tình giúp học sinh học tiếng Trung.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b30-a16","lv":"a","src":"doc","zh":"弟弟每天练习一个小时的钢琴，虽然已经学了两年，但是还想继续提高水平。","py":"Dìdi měitiān liànxí yí ge xiǎoshí de gāngqín, suīrán yǐjīng xué le liǎng nián, dànshì hái xiǎng jìxù tígāo shuǐpíng.","vi":"Em trai mỗi ngày luyện đàn piano một tiếng; tuy đã học hai năm nhưng vẫn muốn tiếp tục nâng cao trình độ.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b30-a17","lv":"a","src":"doc","zh":"我们搬到这个城市快半年了，附近的商店、医院和公共汽车站都已经很熟悉了。","py":"Wǒmen bān dào zhège chéngshì kuài bàn nián le, fùjìn de shāngdiàn, yīyuàn hé gōnggòng qìchē zhàn dōu yǐjīng hěn shúxī le.","vi":"Chúng tôi chuyển đến thành phố này gần nửa năm rồi, các cửa hàng, bệnh viện và bến xe buýt gần nhà đều đã rất quen thuộc.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b30-a18","lv":"a","src":"doc","zh":"他每天早上跑步跑半个小时，已经坚持了三年，所以身体比以前好多了。","py":"Tā měitiān zǎoshang pǎobù pǎo bàn ge xiǎoshí, yǐjīng jiānchí le sān nián, suǒyǐ shēntǐ bǐ yǐqián hǎo duō le.","vi":"Mỗi sáng anh ấy chạy bộ nửa tiếng, đã kiên trì ba năm nên sức khỏe tốt hơn trước nhiều.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b30-a19","lv":"a","src":"doc","zh":"我在这家语言学校学了八个月，现在准备参加考试，看看自己的汉语进步了多少。","py":"Wǒ zài zhè jiā yǔyán xuéxiào xué le bā ge yuè, xiànzài zhǔnbèi cānjiā kǎoshì, kànkan zìjǐ de Hànyǔ jìnbù le duōshao.","vi":"Tôi học ở trường ngôn ngữ này được tám tháng, hiện chuẩn bị tham gia kỳ thi để xem tiếng Trung của mình tiến bộ đến đâu.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b30-a20","lv":"a","src":"doc","zh":"从我们第一次见面到现在已经过去六年了，虽然住在不同的城市，但是一直保持联系。","py":"Cóng wǒmen dì-yī cì jiànmiàn dào xiànzài yǐjīng guòqù liù nián le, suīrán zhù zài bù tóng de chéngshì, dànshì yìzhí bǎochí liánxì.","vi":"Từ lần đầu chúng tôi gặp nhau đến nay đã sáu năm trôi qua; tuy sống ở các thành phố khác nhau nhưng vẫn luôn giữ liên lạc.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"c1","n":22,"lesson":"C","zh":"在 (đang) và 在 (ở)","vi":"Phân biệt 在 (đang) và 在 (ở)","use":"Phân biệt 在 là động từ chỉ vị trí và 在 là phó từ đứng trước động từ biểu thị hành động đang diễn ra.","formula":"S + 在 + nơi chốn (在 = ở). S + 在 + V (+ O) (在 = đang). Phủ định hành động đang diễn ra: S + 没 + 在 + V.","note":"麦克在宿舍。= Mike ở ký túc xá (在 là động từ chỉ vị trí). 麦克在看书。= Mike đang đọc sách (在 là phó từ). Phủ định hành động đang diễn ra: 麦克没在看书。 Không dùng 不在看书 trong mẫu đang diễn ra được học ở bài 17.","cmp":true,"ex":[{"id":"c1-c01","lv":"b","src":"cmp","zh":"麦克在宿舍。","py":"Màikè zài sùshè.","vi":"Mike ở ký túc xá.","ch":["麦克","在","宿舍"],"fp":"。","ord":true,"alt":[]},{"id":"c1-c02","lv":"b","src":"cmp","zh":"麦克在看书。","py":"Màikè zài kàn shū.","vi":"Mike đang đọc sách.","ch":["麦克","在","看","书"],"fp":"。","ord":true,"alt":[]},{"id":"c1-c03","lv":"b","src":"cmp","zh":"麦克没在看书。","py":"Màikè méi zài kàn shū.","vi":"Mike không đang đọc sách.","ch":["麦克","没","在","看","书"],"fp":"。","ord":true,"alt":[]},{"id":"c1-i04","lv":"b","src":"ai","zh":"他们在教室里。","py":"Tāmen zài jiàoshì lǐ.","vi":"Họ ở trong lớp học.","ch":["他们","在","教室","里"],"fp":"。","ord":true,"alt":[]},{"id":"c1-i05","lv":"b","src":"ai","zh":"我们在吃饭。","py":"Wǒmen zài chīfàn.","vi":"Chúng tôi đang ăn cơm.","ch":["我们","在","吃饭"],"fp":"。","ord":true,"alt":[]}]},{"id":"c2","n":23,"lesson":"C","zh":"还是 và 或者 (phân biệt)","vi":"Phân biệt 还是 và 或者","use":"Phân biệt câu hỏi lựa chọn (还是) với câu trần thuật nêu lựa chọn (或者).","formula":"你喝茶还是喝咖啡？ (câu hỏi lựa chọn). 我喝茶或者咖啡都可以。 (câu trần thuật nêu lựa chọn).","note":"Không viết: *你喝茶或者咖啡吗？ nếu ý định là hỏi người nghe chọn một trong hai. 还是 cũng có thể xuất hiện trong câu trần thuật khi chưa quyết định giữa hai lựa chọn (我还没决定是买还是借).","cmp":true,"ex":[{"id":"c2-c01","lv":"b","src":"cmp","zh":"我喝茶或者咖啡都可以。","py":"Wǒ hē chá huòzhě kāfēi dōu kěyǐ.","vi":"Tôi uống trà hoặc cà phê đều được.","ch":["我","喝","茶","或者","咖啡","都","可以"],"fp":"。","ord":true,"alt":[]},{"id":"c2-i02","lv":"b","src":"ai","zh":"你去还是我去？","py":"Nǐ qù háishi wǒ qù?","vi":"Bạn đi hay tôi đi?","ch":["你","去","还是","我","去"],"fp":"？","ord":true,"alt":[]},{"id":"c2-i03","lv":"b","src":"ai","zh":"周末我看电影或者逛街。","py":"Zhōumò wǒ kàn diànyǐng huòzhě guàngjiē.","vi":"Cuối tuần tôi xem phim hoặc đi dạo phố.","ch":["周末","我","看","电影","或者","逛街"],"fp":"。","ord":true,"alt":["我周末看电影或者逛街。"]},{"id":"c2-i04","lv":"b","src":"ai","zh":"你要米饭还是面条？","py":"Nǐ yào mǐfàn háishi miàntiáo?","vi":"Bạn muốn cơm hay mì?","ch":["你","要","米饭","还是","面条"],"fp":"？","ord":true,"alt":[]}]},{"id":"c3","n":24,"lesson":"C","zh":"一点儿 và 有点儿 (phân biệt)","vi":"Phân biệt 一点儿 và 有点儿","use":"一点儿 đứng trước danh từ hoặc sau tính từ; 有点儿 đứng trước tính từ, thường hàm ý hơi bất tiện/không vừa ý."," "alt":["明天我们再来。"]}]},{"id":"c5","n":26,"lesson":"C","zh":"了 sau động từ và 了 cuối câu (phân biệt)","vi":"Phân biệt 了 sau động từ và 了 cuối câu","use":"了 sau động từ nhấn mạnh hành động hoàn thành; 了 cuối câu thông báo tình huống mới/việc đã xảy ra; 了 kép (V了…了) chỉ việc kéo dài đến hiện tại.","formula":"我买了一本书。 (V + 了 + tân ngữ có lượng từ). 我买书了。 (…了 cuối câu). 我在这儿住了两年了。 (V了 + thời lượng + 了).","note":"我在这儿住了两年了 = đã sống ở đây hai năm và hiện vẫn tiếp tục. Không dùng 没有……了 để phủ định hành động quá khứ theo mẫu cơ bản; dùng 没(有) + V.","cmp":true,"ex":[{"id":"c5-c01","lv":"b","src":"cmp","zh":"我买书了。","py":"Wǒ mǎi shū le.","vi":"Tôi mua sách rồi.","ch":["我","买","书了"],"fp":"。","ord":true,"alt":[]},{"id":"c5-c02","lv":"b","src":"cmp","zh":"我在这儿住了两年了。","py":"Wǒ zài zhèr zhù le liǎng nián le.","vi":"Tôi đã sống ở đây hai năm rồi (và vẫn đang sống).","ch":["我","在","这儿","住了","两年了"],"fp":"。","ord":true,"alt":[]},{"id":"c5-i03","lv":"b","src":"ai","zh":"他吃了两个苹果。","py":"Tā chī le liǎng ge píngguǒ.","vi":"Anh ấy đã ăn hai quả táo.","ch":["他","吃了","两个","苹果"],"fp":"。","ord":true,"alt":[]},{"id":"c5-i04","lv":"b","src":"ai","zh":"下雨了。","py":"Xiàyǔ le.","vi":"Trời mưa rồi.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"c6","n":27,"lesson":"C","zh":"Bổ ngữ kết quả và bổ ngữ trạng thái (phân biệt)","vi":"Phân biệt bổ ngữ kết quả và bổ ngữ trạng thái","use":"Bổ ngữ kết quả (V + 对/懂/完…) cho biết kết quả của hành động; bổ ngữ trạng thái (V + 得 + …) miêu tả/đánh giá cách thực hiện.","formula":"做对了 (kết quả). 做得对 (đánh giá cách/kết quả thực hiện). 说得很好 (得 nối động từ với phần mô tả trạng thái). 听懂了 (懂 là kết quả của 听).","note":"做对了: làm và đạt kết quả đúng. 做得对: làm đúng (đánh giá). 说得很好: nói rất tốt. 听懂了: nghe và hiểu được.","cmp":true,"ex":[{"id":"c6-c01","lv":"b","src":"cmp","zh":"他说得很好。","py":"Tā shuō de hěn hǎo.","vi":"Anh ấy nói rất tốt.","ch":["他","说得","很","好"],"fp":"。","ord":true,"alt":[]},{"id":"c6-i02","lv":"b","src":"ai","zh":"我做对了这道题。","py":"Wǒ zuò duì le zhè dào tí.","vi":"Tôi làm đúng câu này rồi.","ch":["我","做","对了","这","道","题"],"fp":"。","ord":true,"alt":[]},{"id":"c6-i03","lv":"b","src":"ai","zh":"她做得对。","py":"Tā zuò de duì.","vi":"Cách cô ấy làm là đúng.","ch":["她","做得","对"],"fp":"。","ord":true,"alt":[]},{"id":"c6-i04","lv":"b","src":"ai","zh":"他听懂了老师的话。","py":"Tā tīng dǒng le lǎoshī de huà.","vi":"Anh ấy nghe hiểu lời giáo viên.","ch":["他","听","懂了","老师的","话"],"fp":"。","ord":true,"alt":[]}]},{"id":"c7","n":28,"lesson":"C","zh":"Câu liên động và câu kiêm ngữ (phân biệt)","vi":"Phân biệt câu liên động và câu kiêm ngữ","use":"Câu liên động: cùng một chủ ngữ thực hiện nhiều động từ. Câu kiêm ngữ: thành phần sau động từ thứ nhất vừa là tân ngữ của động từ ấy, vừa là chủ thể của động từ thứ hai.","formula":"Liên động: S + 去/来 + nơi chốn + V. Kiêm ngữ: S + 请/叫/让/派 + người + V.","note":"我去邮局寄包裹。: cùng chủ ngữ 我 thực hiện 去 và 寄 (liên động). 老师叫我回答问题。: 我 là tân ngữ của 叫, đồng thời là chủ thể của 回答 (kiêm ngữ).","cmp":true,"ex":[{"id":"c7-i01","lv":"b","src":"ai","zh":"我去商店买水果。","py":"Wǒ qù shāngdiàn mǎi shuǐguǒ.","vi":"Tôi đến cửa hàng mua hoa quả. (liên động)","ch":["我","去","商店","买","水果"],"fp":"。","ord":true,"alt":[]},{"id":"c7-i02","lv":"b","src":"ai","zh":"妈妈让我去买水果。","py":"Māma ràng wǒ qù mǎi shuǐguǒ.","vi":"Mẹ bảo tôi đi mua hoa quả. (kiêm ngữ)","ch":["妈妈","让","我","去","买","水果"],"fp":"。","ord":true,"alt":[]},{"id":"c7-i03","lv":"b","src":"ai","zh":"老师请我们唱歌。","py":"Lǎoshī qǐng wǒmen chànggē.","vi":"Giáo viên mời chúng tôi hát. (kiêm ngữ)","ch":["老师","请","我们","唱歌"],"fp":"。","ord":true,"alt":[]},{"id":"c7-i04","lv":"b","src":"ai","zh":"他去图书馆看书。","py":"Tā qù túshūguǎn kàn shū.","vi":"Anh ấy đến thư viện đọc sách. (liên động)","ch":["他","去","图书馆","看","书"],"fp":"。","ord":true,"alt":[]}]},{"id":"c8","n":29,"lesson":"C","zh":"Động từ hai tân ngữ (lưu ý trật tự)","vi":"Lưu ý trật tự câu hai tân ngữ","use":"Động từ hai tân ngữ: tân ngữ chỉ người đứng trước, tân ngữ chỉ vật/nội dung đứng sau.","formula":"S + V + người + vật/nội dung.","note":"老师教我们汉语。: 我们 (người) đứng trước 汉语 (nội dung). Không đảo thành *老师教汉语我们。","cmp":true,"ex":[{"id":"c8-i01","lv":"b","src":"ai","zh":"他教我英语。","py":"Tā jiāo wǒ Yīngyǔ.","vi":"Anh ấy dạy tôi tiếng Anh.","ch":["他","教","我","英语"],"fp":"。","ord":true,"alt":[]},{"id":"c8-i02","lv":"b","src":"ai","zh":"我给他一本书。","py":"Wǒ gěi tā yì běn shū.","vi":"Tôi đưa anh ấy một quyển sách.","ch":["我","给","他","一本","书"],"fp":"。","ord":true,"alt":[]},{"id":"c8-i03","lv":"b","src":"ai","zh":"老师问我们一个问题。","py":"Lǎoshī wèn wǒmen yí ge wèntí.","vi":"Giáo viên hỏi chúng tôi một câu hỏi.","ch":["老师","问","我们","一个","问题"],"fp":"。","ord":true,"alt":[]},{"id":"c8-i04","lv":"b","src":"ai","zh":"她告诉我一件事。","py":"Tā gàosu wǒ yí jiàn shì.","vi":"Cô ấy nói cho tôi một việc.","ch":["她","告诉","我","一件","事"],"fp":"。","ord":true,"alt":[]}]}];
const APP_ID = "HSK2_Grammar_Master", APP_SCHEMA = 1, LS_KEY = "hsk2gm.progress";

/* ============ TIỆN ÍCH ============ */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAY = 86400000, MIN = 60000;
const now = () => Date.now();
const sod = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dayKey = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const rnd = n => Math.floor(Math.random() * n);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sample(a, n) { return shuffle(a).slice(0, n); }
const pct = x => Math.round(x * 100) + "%";

/* ============ ĐĂNG KÝ NỘI DUNG ============ */
const UB = {}, EB = {}, ALLEX = [];
UNITS.forEach(u => {
  UB[u.id] = u;
  u.ex.forEach(e => { e.uid = u.id; e.canOrder = !!e.ord && e.ch.length >= 3; e.okSet = new Set([e.zh].concat(e.alt || [])); EB[e.id] = e; ALLEX.push(e); });
});
const TOTAL_UNITS = UNITS.length;
const GROUPS = [["Nhóm 1", "Bài 16–18"], ["Nhóm 2", "Bài 19–21"], ["Nhóm 3", "Bài 22–24"], ["Nhóm 4", "Bài 25–27"], ["Nhóm 5", "Bài 28–30"], ["Nhóm 6", "Phần phân biệt"], ["Nhóm 7", "Bổ sung"]];
const EGRP = {}; ALLEX.forEach(e => { const u = UB[e.uid]; EGRP[e.id] = u.lesson === "C" ? 5 : Math.max(0, Math.min(4, Math.floor((Number(u.lesson) - 16) / 3))); });
const GSIZE = GROUPS.map((_, g) => ALLEX.filter(e => EGRP[e.id] === g).length);
const TOTAL_Q = ALLEX.length;
/* ===== Bài tập "Bổ sung" (Nhóm 7): tự sinh từ ví dụ của thẻ từ vựng ===== */
UB.bs = { id: "bs", n: 0, lesson: "S", zh: "Bổ sung", vi: "Từ vựng do bạn tự thêm", use: "", formula: "Câu ví dụ trong thẻ từ vựng của bạn.", ex: [], hidden: true };
let LEXB = null;
function lexicon() { if (!LEXB) { LEXB = new Set(Object.keys(VOCAB_DICT)); Object.keys(DICT).forEach(w => LEXB.add(w)); ALLEX.forEach(e => { if (e.uid !== "bs") e.ch.forEach(t => LEXB.add(t)); }); } return LEXB; }
const PUN_RE = /[，。？！、；：“”‘’（）…—]/;
function normZh(s) { return String(s || "").replace(/\s+/g, "").replace(/,/g, "，").replace(/\?/g, "？").replace(/!/g, "！").replace(/;/g, "；").replace(/:/g, "：").replace(/\.$/, "。"); }
function segment(txt, word, lex) {
  const out = [];
  const seg = p => {
    const N = p.length, best = new Array(N + 1).fill(0), len = new Array(N + 1).fill(1);
    for (let i = N - 1; i >= 0; i--) {
      if (PUN_RE.test(p[i])) { best[i] = best[i + 1] + 1; len[i] = 1; continue; }
      best[i] = best[i + 1] + 1; len[i] = 1;
      for (let n = 2; n <= Math.min(6, N - i); n++) { const w = p.slice(i, i + n); if (/[^\u4e00-\u9fff]/.test(w) || !lex.has(w)) continue; if (best[i + n] + 1 <= best[i]) { best[i] = best[i + n] + 1; len[i] = n; } }
    }
    for (let i = 0; i < N; i += len[i]) out.push(p.slice(i, i + len[i]));
  };
  const k = word ? txt.indexOf(word) : -1;
  if (k >= 0) { seg(txt.slice(0, k)); out.push(word); seg(txt.slice(k + word.length)); } else seg(txt);

/* ---------- Tách câu: ghép chữ Hán – pinyin – nghĩa theo từng câu ---------- */
const BK_H = /[^。！？!?\n]*[。！？!?]+[”’」』）)"]*|[^。！？!?\n]+/g;
const BK_PV = /[^.。！？!?\n]*[.。！？!?]+[”’」』）)"]*|[^.。！？!?\n]+/g;
const BK_SPK = /^([^\s：:，,。！？!?“”"'（）()]{1,6})[：:]\s*(?![“"])/;
const BK_PRE = /^[^:：.。!?！？]{1,24}[:：]\s*/;
/* Bộ nhớ đệm: tách câu/lượt thoại chỉ tính lại khi nội dung bài khóa đổi (txPlayAt gọi cho mỗi câu) */
let BK_UC = { key: "", val: null };
function bkUnits(t) {
  const key = t.id + "\u0003" + t.blocks.map(b => b.h + "\u0001" + b.p + "\u0001" + b.v).join("\u0002");
  if (BK_UC.key !== key) BK_UC = { key, val: bkUnitsRaw(t) };
  return BK_UC.val;
}
function bkUnitsRaw(t) {
  const out = [], sp = (s, re) => (String(s || "").match(re) || []).map(x => x.trim()).filter(Boolean);
  const L = s => String(s || "").split(/\n+/).map(x => x.trim()).filter(Boolean);
  const flat = s => String(s || "").replace(/\s+/g, " ").trim();
  t.blocks.forEach((b, bi) => {
    let H = sp(b.h, BK_H), P = sp(b.p, BK_PV), V = sp(b.v, BK_PV);
    const ok = () => (!P.length || P.length === H.length) && (!V.length || V.length === H.length);
    if (!ok()) {
      const h2 = L(b.h), p2 = L(b.p), v2 = L(b.v);
      if ((!p2.length || p2.length === h2.length) && (!v2.length || v2.length === h2.length)) { H = h2; P = p2; V = v2; }
      else { H = [flat(b.h)]; P = flat(b.p) ? [flat(b.p)] : []; V = flat(b.v) ? [flat(b.v)] : []; }
    }
    H.forEach((h, k) => { if (!h) return; out.push({ bi, h, p: P[k] || "", v: V[k] || "" }); });
  });
  /* H\u1ed9i tho\u1ea1i: nh\u1eadn di\u1ec7n "T\u00ean\uff1ac\u00e2u n\u00f3i", b\u1ecf t\u00ean kh\u1ecfi ph\u1ea7n \u0111\u1ecdc, g\u00e1n gi\u1ecdng theo nh\u00e2n v\u1eadt */
  const names = [];
  out.forEach(u => { const m = u.h.match(BK_SPK); if (m && !/[\u8bf4\u9053\u95ee\u7b54\u8bb2]$/.test(m[1])) { u.nm = m[1]; if (!names.includes(m[1])) names.push(m[1]); } });
  const dlg = names.length >= 2; let cur = 0;
  out.forEach(u => {
    if (dlg && u.nm) { cur = names.indexOf(u.nm); u.h = u.h.replace(BK_SPK, ""); u.p = u.p.replace(BK_PRE, ""); u.v = u.v.replace(BK_PRE, ""); u.who = u.nm; }
    u.spk = dlg ? cur : 0; u.cj = (u.h.match(/[\u4e00-\u9fff]/g) || []).join("");
  });
  const res = out.filter(u => u.h);
  if (!dlg) return res;
  /* Hội thoại: mỗi lượt thoại (từ tên nhân vật đến tên kế tiếp) gộp thành một câu */
  const turns = [];
  res.forEach(u => { const p = turns[turns.length - 1]; if (p && p.who && !u.who && p.bi === u.bi) { p.h += u.h; p.p = (p.p + " " + u.p).trim(); p.v = (p.v + " " + u.v).trim(); p.cj += u.cj; } else turns.push(u); });
  return turns;
}
let BK_LEX = null, BK_LEXN = -1;
function bkLex() {
  const n = S.vocab.length; if (BK_LEX && BK_LEXN === n) return BK_LEX;
  const l = new Set(Object.keys(VOCAB_DICT)); Object.keys(DICT).forEach(w => l.add(w)); Object.keys(HV_DICT).forEach(w => l.add(w)); S.vocab.forEach(v => l.add(v.zh));
  ALLEX.forEach(e => { if (e.uid !== "bs") e.ch.forEach(t => { const w = t.replace(/[^\u4e00-\u9fff]/g, ""); if (w.length >= 2 && w.length <= 4 && !/[了呢吗吧的]$/.test(w) && !/^[一二两三四五六七八九十]/.test(w)) l.add(w); }); });
  BK_LEX = l; BK_LEXN = n; return l;
}
function bkSenHTML(u, i) {
  let k = 0, wi = 0;
  const hh = segment(u.h, "", bkLex()).map(tk => { if (!/^[\u4e00-\u9fff]+$/.test(tk)) return esc(tk); const w = wi++; return [...tk].map(c => `<span class="c" data-k="${k++}" data-w="${w}">${esc(c)}</span>`).join(""); }).join("");
  const toks = u.p ? u.p.split(/\s+/).filter(Boolean) : [];
  const pp = toks.map((x, j) => `<span class="pt" data-k="${j}">${esc(x)}</span>`).join(" ");
  const who = u.who ? `<div class="wh"><span class="who s${u.spk % 3}">${esc(u.who)}</span></div>` : "";
  return `<div class="sen s${u.spk % 3}" data-spk="${u.spk}" data-i="${i}" data-bi="${u.bi}" data-m="${toks.length}"><button class="splay" data-act="bk-from" data-i="${i}" aria-label="Nghe câu này">▶</button><div class="sb">${who}<div class="sh">${hh}</div>${pp ? `<div class="sp">${pp}</div>` : ""}${u.v ? `<div class="sv">${esc(u.v)}</div>` : ""}</div></div>`;
}

/* ---------- 5 tùy chọn giọng cho 2 nhân vật chính ----------
   Lấy các giọng tiếng Trung có trên thiết bị; nếu chưa đủ 5 giọng thì cùng một giọng được đổi cao độ (cao/trầm) để phân biệt. */
function bkVoiceList() {
  if (!TTS.ok) return [];
  const vs = (speechSynthesis.getVoices() || []).filter(v => /^(zh|cmn)/i.test(v.lang)), seen = new Set(), out = [];
  vs.sort((a, b) => (/^zh[-_]CN/i.test(b.lang) ? 1 : 0) - (/^zh[-_]CN/i.test(a.lang) ? 1 : 0));
  vs.forEach(v => { if (!seen.has(v.name)) { seen.add(v.name); out.push(v); } });
  if (TTS.voice && !seen.has(TTS.voice.name)) out.unshift(TTS.voice);
  return out;
}
function bkVoiceOpts() {
  const V = bkVoiceList(), cn = V.find(v => /[-_](CN|Hans)/i.test(v.lang)) || V[0] || null, isTW = v => /[-_](TW|Hant)/i.test(v.lang) || /Taiwan|Đài Loan|台灣|臺灣|Hanhan|Yating|Zhiwei|HsiaoChen|HsiaoYu|Mei-?Jia/i.test(v.name), other = V.find(v => v !== cn && isTW(v)) || V.find(v => v !== cn) || null;

/* ---------- Cách tính "Nhớ %" của bài học ----------
   80% khi đã đánh dấu hoàn thành bài và đạt tất cả câu ở "Luyện bài này"
   +10% khi đúng tất cả câu của bài ở thẻ Ôn tập; +10% khi đạt tất cả câu của bài ở Luyện tập theo nhóm
   -10% cho mỗi câu của bài đang ở trạng thái sai */
function unitMem(uid, t) {
  t = t || TRK(); const ex = trackEx(t).filter(e => e.uid === uid); if (!ex.length) return 0;
  const LP = S.lp || {}, PQ = S.pq || {}, RV = S.rv || {};
  const allLp = ex.every(e => LP[e.id] && LP[e.id].s === "ok");
  const allPq = ex.every(e => PQ[e.id] && PQ[e.id].s === "ok");
  const allRv = ex.every(e => RV[e.id] === 1);
  let wrong = 0; ex.forEach(e => { if ((LP[e.id] && LP[e.id].s === "wr") || (PQ[e.id] && PQ[e.id].s === "wr") || RV[e.id] === 0) wrong++; });
  return clamp((S.done[uid] && allLp ? 80 : 0) + (allRv ? 10 : 0) + (allPq ? 10 : 0) - 10 * wrong, 0, 100);
}


/* ---------- Vai trong hội thoại bài khóa ---------- */
/* Hai nhân vật chính = hai người có nhiều lượt thoại nhất; nhân vật từ thứ ba trở đi là nhân vật nền (giọng tông 0.9) */
function bkRoles(U) {
  const cnt = {}, nm = {};
  U.forEach(u => { cnt[u.spk] = (cnt[u.spk] || 0) + 1; if (u.who && !nm[u.spk]) nm[u.spk] = u.who; });
  const ids = Object.keys(cnt).map(Number);
  if (ids.length < 2) return { multi: false, mains: [], nm };
  const mains = ids.slice().sort((x, y) => cnt[y] - cnt[x] || x - y).slice(0, 2).sort((x, y) => x - y);
  return { multi: true, mains, nm };
}
