<title>HSK 2 Grammar Master</title>
<style>

}

  --g1:#fbe4ec; --g2:#f6cddb; --g3:#eda6bf; --g4:#e07da1; --gd:#a8486e; --gdd:#6e2745;

  --a1:#ee9bb8; --a2:#de739b; --argb:222,115,155; --srgb:168,72,110;
  --hdr:rgba(253,243,246,.92); --h1:#fbdfe8; --h2:#fff8fa; --t1:#fdf7f9; --s1:#fdf0f4; --s2:#fbdfe8; --sp1:#f6c8d8; --foc:#eba5bf; --py:#a8486e; --vi:#6b525a; --b1:#f2a9c2;
}
html[data-theme="blue"]{
  --bg:#f1f7fd; --bg2:#e3eefa; --cream:#f9fbff;
  --g1:#e0eefb; --g2:#c6def5; --g3:#98c3ec; --g4:#5a9fdc; --gd:#2f6aa3; --gdd:#1f4a75;
  --ink:#223344; --muted:#66798c; --line:#d9e6f2;
  --shadow:0 2px 10px rgba(47,106,163,.10); --shadow2:0 6px 22px rgba(47,106,163,.16);
  --a1:#7ab7ea; --a2:#4a94d6; --argb:74,148,214; --srgb:47,106,163;
  --hdr:rgba(241,247,253,.92); --h1:#dcebfa; --h2:#f7fbff; --t1:#f6faff; --s1:#f0f7fe; --s2:#dcebfa; --sp1:#bfdbf5; --foc:#8fc0ec; --py:#2f6aa3; --vi:#4a5f73; --b1:#9cc9f0;
}
html[data-theme="lemon"]{
  --bg:#fcfbe9; --bg2:#f7f4cc; --cream:#fffef2;
  --g1:#f6f3c8; --g2:#ebe6a0; --g3:#d9d36a; --g4:#b9b232; --gd:#7a7410; --gdd:#4f4b08;
  --ink:#34321a; --muted:#7d7a55; --line:#ece9c4;
  --shadow:0 2px 10px rgba(122,116,16,.10); --shadow2:0 6px 22px rgba(122,116,16,.16);
  --a1:#d6d14f; --a2:#b9b232; --argb:185,178,50; --srgb:122,116,16;
  --hdr:rgba(252,251,233,.92); --h1:#f5f2c4; --h2:#fffef3; --t1:#fffef5; --s1:#fefce8; --s2:#f6f3c8; --sp1:#ece8a6; --foc:#d3cd62; --py:#7a7410; --vi:#58552f; --b1:#dcd762;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",Roboto,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--gd)}
.wrap{max-width:680px;margin:0 auto;padding:12px 14px 20px}
header.top{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .in{max-width:680px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;flex:1;color:var(--gdd);letter-spacing:.2px}
header.top a.gear{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;text-decoration:none;font-size:20px;background:var(--g1)}
nav.tabs{border-top:1px solid var(--line)}
nav.tabs .in{display:flex;gap:0;align-items:stretch;max-width:680px;margin:0 auto;padding:0 6px}
nav.tabs a{flex:1;min-width:0;text-align:center;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;line-height:1.25}
nav.tabs a .ic{font-size:17px;line-height:1.1}
nav.tabs a.on{color:var(--gd)}
nav.tabs a.on::after{content:"";position:absolute;bottom:0;left:28%;right:28%;height:3px;border-radius:3px 3px 0 0;background:var(--g4)}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 8px);background:var(--warn);color:#5a3a00;font-size:9.5px;border-radius:9px;min-width:15px;height:15px;padding:0 4px;display:grid;place-items:center;font-weight:700}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin:12px 0;border:1px solid var(--line)}
.card.cream{background:var(--cream)}
.card h2,.card h3{margin:0 0 8px;color:var(--gdd)}
h2.sec{font-size:15px;color:var(--gd);margin:18px 2px 6px;text-transform:uppercase;letter-spacing:.6px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:8px} .row.wrap2{flex-wrap:wrap} .grow{flex:1;min-width:0} .sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;background:var(--g1);color:var(--gdd);min-height:44px;transition:transform .12s,box-shadow .2s,background .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 4px 12px rgba(var(--argb),.35)}
.btn.ghost{background:transparent;border:1.5px solid var(--g3)}
.btn.warn{background:var(--warnbg);color:#8a5200} .btn.bad{background:var(--badbg);color:#a43c3c}
.btn.block{display:flex;width:100%} .btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.icon{width:44px;padding:0;font-size:20px}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:3px solid var(--foc);outline-offset:2px}
.chip{border:1.5px solid var(--g2);background:#fff;border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;color:var(--gd);min-height:36px}
.chip.on{background:var(--g4);border-color:var(--g4);color:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.new{background:#eef1ee;color:#6b7a70} .pill.learning{background:var(--bluebg);color:#2f6b9c} .pill.review{background:var(--warnbg);color:#8a5200} .pill.mastered{background:var(--okbg);color:#1f7a45}
.pill.src-doc{background:var(--g1);color:var(--gd)} .pill.src-cmp{background:var(--bluebg);color:#2f6b9c} .pill.src-ai{background:#f3e8fb;color:#6d3d8f}
.bar{height:10px;background:var(--g1);border-radius:99px;overflow:hidden} .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b1),var(--a2));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.stat .ic{font-size:24px;width:42px;height:42px;display:grid;place-items:center;background:var(--g1);border-radius:13px;flex:none}
.stat b{display:block;font-size:21px;line-height:1.1;color:var(--gdd)} .stat span{font-size:12px;color:var(--muted);line-height:1.2;display:block}
.hero{background:linear-gradient(160deg,var(--h1) 0%,var(--h2) 100%);border-radius:24px;padding:16px;border:1px solid var(--g2);box-shadow:var(--shadow2);margin-top:10px}
.hero h2{margin:0;font-size:22px;color:var(--gdd)}
.hdrApple{width:30px;height:30px;display:block}
.mascot{width:78px;height:78px;flex:none;animation:bob 3.2s ease-in-out infinite}
.bubble{background:#fff;border:1px solid var(--g2);border-radius:14px 14px 14px 4px;padding:8px 11px;font-size:14px;position:relative;box-shadow:var(--shadow)}
.zh{font-size:22px;line-height:1.55;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",system-ui,sans-serif;letter-spacing:.5px;word-break:break-all}
.zh.big{font-size:28px} .zh.mid{font-size:19px}
.py{color:var(--py);font-size:15px;display:none} .vi{color:var(--vi);font-size:15px;display:none}
.all-py .py,.ex.s-py .py,.rev .py{display:block} .all-vi .vi,.ex.s-vi .vi,.rev .vi{display:block}
.ex{padding:12px 4px;border-bottom:1px dashed var(--line)} .ex:last-child{border:0}
.ex .head{display:flex;gap:8px;align-items:flex-start} .ex .num{font-size:12px;font-weight:800;color:var(--g4);width:22px;padding-top:8px;flex:none}
.formula{background:var(--g1);border-left:4px solid var(--g4);padding:10px 12px;border-radius:10px;font-size:15px;white-space:pre-wrap}
.note{background:var(--warnbg);border-left:4px solid var(--warn);padding:10px 12px;border-radius:10px;font-size:15px}
.tabs2{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none} .tabs2::-webkit-scrollbar{display:none}
.seg{display:inline-flex;background:var(--g1);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 11px;font-weight:700;font-size:13px;color:var(--gd);min-height:34px}
.seg button.on{background:#fff;box-shadow:var(--shadow)}
input[type=search],select,input[type=text]{width:100%;border:1.5px solid var(--g2);border-radius:14px;padding:11px 13px;font:inherit;background:#fff;min-height:44px;color:var(--ink)}
.lesson-item{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.lesson-item .no{width:42px;height:42px;border-radius:14px;background:var(--g1);color:var(--gd);font-weight:800;display:grid;place-items:center;flex:none;font-size:15px}
.lesson-item.done .no{background:var(--g4);color:#fff}
.lesson-item .t{font-weight:700;font-size:17px;line-height:1.3} .lesson-item .s{font-size:13px;color:var(--muted);line-height:1.3}
.fade{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop{animation:pop .3s ease} .shake{animation:shake .3s ease}
.sway{transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite} @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
/* mascot trái cây tiến hóa */
.fruit{display:inline-block;position:relative;width:1em;height:1em;font-size:78px;flex:none;line-height:1}
.fruit.sm{font-size:30px}
.fevo,.fbody{position:absolute;inset:0;display:block}
.fbody{animation:fruitFloat 3.4s ease-in-out infinite;will-change:transform}
.femoji{position:absolute;inset:0;display:grid;place-items:center;font-size:.78em;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.fface{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform-origin:50% 50%;filter:drop-shadow(0 0 .6px rgba(255,255,255,.9))}
.fface .feyes{transform-box:fill-box;transform-origin:center;animation:fblink .45s ease-in-out 3}
@keyframes fblink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.12)}}
.fevo.spin{animation:fruitEvolve 1.1s cubic-bezier(.34,1.2,.5,1)}
.fglow{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,rgba(255,238,160,.9),rgba(255,238,160,0) 65%);opacity:0;pointer-events:none}
.fruit.evolving .fglow{animation:fruitGlow 1.1s ease-out}
@keyframes fruitFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7%) scale(1.035)}}
@keyframes fruitEvolve{0%{transform:rotate(0) scale(1)}45%{transform:rotate(200deg) scale(1.45)}100%{transform:rotate(360deg) scale(1)}}
@keyframes fruitGlow{0%{opacity:0;transform:scale(.5)}40%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1.6)}}
/* word order */
.ans{min-height:64px;border:2px dashed var(--g3);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;background:var(--cream);align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;min-height:52px}
.tok{border:0;background:#fff;border:1.5px solid var(--g3);box-shadow:0 2px 0 var(--g3);border-radius:12px;padding:8px 13px;font-size:20px;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;min-height:44px;transition:transform .12s}
.tok:active{transform:translateY(2px);box-shadow:none}
.tok.used{visibility:hidden}
.tok.in-ans{background:var(--g1)}
.ans.ok{border-color:var(--ok);background:var(--okbg)} .ans.bad{border-color:var(--bad);background:var(--badbg)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--g2);border-radius:14px;padding:12px 14px;margin:8px 0;font-size:16px;min-height:50px;transition:background .2s,border-color .2s,transform .12s}
.opt:active{transform:scale(.99)}
.opt .ol{display:inline-block;min-width:26px;color:var(--gd);font-weight:800}
.opt.hid .ot{visibility:hidden}
.tok.hid{color:transparent;text-shadow:none;user-select:none;-webkit-user-select:none}
.opt.zh{font-size:19px}
.opt.right{background:var(--okbg);border-color:var(--ok);font-weight:700} .opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.locked{pointer-events:none}
.opt.sel{border-color:var(--g4);background:var(--g1)}
.fb{border-radius:14px;padding:10px 12px;font-weight:700;margin:10px 0} .fb.ok{background:var(--okbg);color:#1f7a45} .fb.bad{background:var(--badbg);color:#a43c3c}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.rate button{border:0;border-radius:14px;padding:9px 2px 8px;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:62px;transition:transform .12s}
.rate button:active{transform:scale(.95)} .rate button small{font-weight:600;font-size:11px;opacity:.8}
.rate .r0{background:var(--badbg);color:#a43c3c} .rate .r1{background:var(--warnbg);color:#8a5200} .rate .r2{background:var(--okbg);color:#1f7a45} .rate .r3{background:#d6f1de;color:#146a3a}
.rate button.sug{outline:3px solid var(--g4);outline-offset:1px}
.rate.one{grid-template-columns:1fr}
/* flashcard */
.scene{perspective:1100px;margin:10px 0}
.fcard{position:relative;min-height:290px;transition:transform .55s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:18px;background:#fff;border:1.5px solid var(--g2);box-shadow:var(--shadow2);overflow:auto;display:flex;flex-direction:column;justify-content:center}
.face.back{transform:rotateY(180deg);background:var(--cream);justify-content:flex-start}
.face .kind{position:absolute;top:10px;left:14px}
.face.front{align-items:center;text-align:center}
.noanim .fcard{transition:none}
/* vocab flashcard v2 */
.vfront-zh{font-weight:700;line-height:1.15;text-align:center;word-break:keep-all}
.vhead{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:2px}
.vhead .zh{font-size:30px;font-weight:700;color:var(--gdd);line-height:1.2}
.seg.full{display:flex;width:100%}.seg.full button{flex:1;white-space:nowrap;padding:6px 4px}
.trvi{font-size:clamp(21px,6vw,27px);font-weight:700;line-height:1.4;text-align:center;color:var(--gdd);margin-top:10px}
.tform input.tin{font-size:17px;padding:10px 13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a4a36;color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;z-index:60;max-width:90vw;box-shadow:var(--shadow2);animation:rise .25s ease}
.modal-bg{position:fixed;inset:0;background:rgba(30,50,38,.45);display:grid;place-items:center;z-index:70;padding:20px;animation:rise .2s ease}
.modal{background:#fff;border-radius:20px;padding:18px;max-width:420px;width:100%;box-shadow:var(--shadow2)}
.modal h3{margin:0 0 6px;color:var(--gdd)}
.chartbox{overflow-x:auto}
svg text{font-family:system-ui,sans-serif}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.list-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)} .list-row:last-child{border:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px} .kv:last-child{border:0}
.banner{background:var(--warnbg);color:#7a4a00;border-radius:12px;padding:8px 12px;font-size:13px;margin:8px 0}
.hide{display:none!important}
.sticky-actions{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));z-index:10}
@media (max-width:360px){.grid2{gap:8px}.stat b{font-size:18px}.stat .ic{width:36px;height:36px;font-size:20px}.zh.big{font-size:25px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fcard{transition:none!important}}


/* ===== Trang chủ & mục học ===== */
.trk{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border:1px solid var(--g2);border-bottom:4px solid var(--g3);border-radius:18px;background:linear-gradient(180deg,#fff 0%,var(--t1) 100%);margin:12px 0;cursor:pointer;font:inherit;color:inherit;box-shadow:0 6px 14px rgba(var(--srgb),.12),inset 0 1px 0 #fff;transition:transform .12s,box-shadow .12s,border-color .2s,background .2s}
.trk:active{transform:translateY(3px);border-bottom-width:1px;margin-bottom:15px;box-shadow:0 1px 3px rgba(var(--srgb),.12)}
.trk.on{border-color:var(--g3);border-bottom-color:var(--g4);background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 100%);box-shadow:0 8px 18px rgba(var(--argb),.22),inset 0 1px 0 #fff}
.trk .tic{font-size:30px;line-height:1;width:52px;height:52px;display:grid;place-items:center;flex:none;border-radius:15px;background:#fff;border:1px solid var(--g2);box-shadow:0 3px 0 var(--g2),0 4px 8px rgba(var(--srgb),.10)}
.trk.on .tic{border-color:var(--g3);box-shadow:0 3px 0 var(--g3),0 4px 8px rgba(var(--srgb),.14)}
.trk .tt{font-weight:800;font-size:17px;color:var(--gdd)}
.tstrip{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--g1);border:1px solid var(--g2);border-radius:12px;padding:6px 12px;font-size:13px;margin:4px 0 2px;color:var(--gdd)}

/* ===== Flashcard (thiết kế mới) ===== */

true,"alt":["每天我练习写汉字。"]},{"id":"b16a-b08","lv":"b","src":"doc","zh":"他常常在网上查资料。","py":"Tā chángcháng zài wǎngshàng chá zīliào.","vi":"Anh ấy thường tra tài liệu trên mạng.","ch":["他","常常","在","网上","查","资料"],"fp":"。","ord":true,"alt":["他在网上常常查资料。"]},{"id":"b16a-b09","lv":"b","src":"doc","zh":"昨天晚上妈妈给我打电话。","py":"Zuótiān wǎnshang māma gěi wǒ dǎ diànhuà.","vi":"Tối qua mẹ gọi điện cho tôi.","ch":["昨天","晚上","妈妈","给","我","打","电话"],"fp":"。","ord":true,"alt":["妈妈昨天晚上给我打电话。"]},{"id":"b16a-b10","lv":"b","src":"doc","zh":"下个星期我们去上海。","py":"Xià ge xīngqī wǒmen qù Shànghǎi.","vi":"Tuần sau chúng tôi đi Thượng Hải.","ch":["下个星期","我们","去","上海"],"fp":"。","ord":true,"alt":["我们下个星期去上海。"]},{"id":"b16a-a11","lv":"a","src":"doc","zh":"我每天早上七点在家吃早饭，然后坐公共汽车去学校。","py":"Wǒ měitiān zǎoshang qī diǎn zài jiā chī zǎofàn, ránhòu zuò gōnggòng qìchē qù xuéxiào.","vi":"Mỗi sáng lúc 7 giờ tôi ăn sáng ở nhà, sau đó đi xe buýt đến trường.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16a-a12","lv":"a","src":"doc","zh":"昨天下午我在图书馆复习了两个小时，晚上又跟同学练习了口语。","py":"Zuótiān xiàwǔ wǒ zài túshūguǎn fùxí le liǎng ge xiǎoshí, wǎnshang yòu gēn tóngxué liànxí le kǒuyǔ.","vi":"Chiều qua tôi ôn bài ở thư viện hai tiếng, tối lại luyện khẩu ngữ với bạn học.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16a-a13","lv":"a","src":"doc","zh":"星期天如果天气不错，我们打算上午去爬山，下午回来做饭。","py":"Xīngqītiān rúguǒ tiānqì búcuò, wǒmen dǎsuàn shàngwǔ qù páshān, xiàwǔ huílai zuò fàn.","vi":"Nếu Chủ nhật thời tiết khá tốt, chúng tôi dự định sáng đi leo núi, chiều về nấu ăn.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16a-a14","lv":"a","src":"doc","zh":"他最近每天晚上都在宿舍学习，因为下个月要参加汉语考试。","py":"Tā zuìjìn měitiān wǎnshang dōu zài sùshè xuéxí, yīnwèi xià ge yuè yào cānjiā Hànyǔ kǎoshì.","vi":"Gần đây tối nào anh ấy cũng học ở ký túc xá vì tháng sau phải tham gia kỳ thi tiếng Trung.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16a-a15","lv":"a","src":"doc","zh":"我们约好明天下午三点在邮局门口见面，你最好提前十分钟到。","py":"Wǒmen yuē hǎo míngtiān xiàwǔ sān diǎn zài yóujú ménkǒu jiànmiàn, nǐ zuì hǎo tíqián shí fēnzhōng dào.","vi":"Chúng tôi hẹn gặp lúc 3 giờ chiều mai trước cửa bưu điện, tốt nhất bạn nên đến sớm 10 phút.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16a-a16","lv":"a","src":"doc","zh":"去年冬天我在北京住了三个月，那段时间每天都很冷。","py":"Qùnián dōngtiān wǒ zài Běijīng zhù le sān ge yuè, nà duàn shíjiān měitiān dōu hěn lěng.","vi":"Mùa đông năm ngoái tôi sống ở Bắc Kinh ba tháng, thời gian đó ngày nào cũng rất lạnh.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16a-a17","lv":"a","src":"doc","zh":"爸爸星期五晚上下班以后，常常带我们去附近的饭馆吃饭。","py":"Bàba xīngqīwǔ wǎnshang xiàbān yǐhòu, chángcháng dài wǒmen qù fùjìn de fànguǎn chīfàn.","vi":"Sau khi tan làm tối thứ Sáu, bố thường đưa chúng tôi đến quán ăn gần nhà.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16a-a18","lv":"a","src":"doc","zh":"我有时候早上先跑步，再回家洗澡、吃早饭。","py":"Wǒ yǒu shíhou zǎoshang xiān pǎobù, zài huí jiā xǐzǎo, chī zǎofàn.","vi":"Đôi khi buổi sáng tôi chạy bộ trước, rồi về nhà tắm và ăn sáng.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16a-a19","lv":"a","src":"doc","zh":"这家商店每天上午九点开门，晚上九点关门，节假日也营业。","py":"Zhè jiā shāngdiàn měitiān shàngwǔ jiǔ diǎn kāimén, wǎnshang jiǔ diǎn guānmén, jiéjiàrì yě yíngyè.","vi":"Cửa hàng này mở cửa lúc 9 giờ sáng, đóng cửa lúc 9 giờ tối hằng ngày và ngày lễ cũng hoạt động.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16a-a20","lv":"a","src":"doc","zh":"我们打算下星期一上午从大阪出发，下午到东京以后先去酒店休息。","py":"Wǒmen dǎsuàn xià xīngqīyī shàngwǔ cóng Dàbǎn chūfā, xiàwǔ dào Dōngjīng yǐhòu xiān qù jiǔdiàn xiūxi.","vi":"Chúng tôi dự định sáng thứ Hai tuần sau xuất phát từ Osaka, chiều đến Tokyo rồi đến khách sạn nghỉ trước.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"b16b","n":2,"lesson":"16","zh":"还是 và 或者","vi":"还是 và 或者 – Hay / Hoặc","use":"还是 dùng trong câu hỏi lựa chọn; 或者 dùng trong câu trần thuật để nêu khả năng thay thế.","formula":"A + 还是 + B？ / A + 或者 + B。","note":"Không thêm 吗 vào câu hỏi lựa chọn đã dùng 还是. 还是 còn dùng trong câu trần thuật khi chưa quyết định giữa hai lựa chọn (我还没决定是买还是借); 或者 không dùng để hỏi lựa chọn.","cmp":false,"ex":[{"id":"b16b-b01","lv":"b","src":"doc","zh":"你喝茶还是喝咖啡？","py":"Nǐ hē chá háishi hē kāfēi?","vi":"Bạn uống trà hay cà phê?","ch":["你","喝","茶","还是","喝","咖啡"],"fp":"？","ord":true,"alt":[]},{"id":"b16b-b02","lv":"b","src":"doc","zh":"你坐车还是走路？","py":"Nǐ zuò chē háishi zǒu lù?","vi":"Bạn đi xe hay đi bộ?","ch":["你","坐","车","还是","走","路"],"fp":"？","ord":true,"alt":[]},{"id":"b16b-b03","lv":"b","src":"doc","zh":"今天我们去公园还是去商店？","py":"Jīntiān wǒmen qù gōngyuán háishi qù shāngdiàn?","vi":"Hôm nay chúng ta đi công viên hay cửa hàng?","ch":["今天","我们","去","公园","还是","去","商店"],"fp":"？","ord":true,"alt":["我们今天去公园还是去商店？"]},{"id":"b16b-b04","lv":"b","src":"doc","zh":"你要红色的还是蓝色的？","py":"Nǐ yào hóngsè de háishi lánsè de?","vi":"Bạn muốn cái màu đỏ hay màu xanh dương?","ch":["你","要","红色的","还是","蓝色的"],"fp":"？","ord":true,"alt":[]},{"id":"b16b-b05","lv":"b","src":"doc","zh":"你星期六来还是星期天来？","py":"Nǐ xīngqīliù lái háishi xīngqītiān lái?","vi":"Bạn đến thứ Bảy hay Chủ nhật?","ch":["你","星期六","来","还是","星期天","来"],"fp":"？","ord":true,"alt":["星期六你来还是星期天来？"]},{"id":"b16b-b06","lv":"b","src":"doc","zh":"我们可以坐公共汽车或者坐地铁。","py":"Wǒmen kěyǐ zuò gōnggòng qìchē huòzhě zuò dìtiě.","vi":"Chúng ta có thể đi xe buýt hoặc tàu điện ngầm.","ch":["我们","可以","坐","公共汽车","或者","坐","地铁"],"fp":"。","ord":true,"alt":[]},{"id":"b16b-b07","lv":"b","src":"doc","zh":"晚上我看书或者听音乐。","py":"Wǎnshang wǒ kàn shū huòzhě tīng yīnyuè.","vi":"Buổi tối tôi đọc sách hoặc nghe nhạc.","ch":["晚上","我","看","书","或者","听","音乐"],"fp":"。","ord":true,"alt":["我晚上看书或者听音乐。"]},{"id":"b16b-b08","lv":"b","src":"doc","zh":"他想学汉语或者英语。","py":"Tā xiǎng xué Hànyǔ huòzhě Yīngyǔ.","vi":"Anh ấy muốn học tiếng Trung hoặc tiếng Anh.","ch":["他","想","学","汉语","或者","英语"],"fp":"。","ord":true,"alt":[]},{"id":"b16b-b09","lv":"b","src":"doc","zh":"你要自己去还是跟朋友一起去？","py":"Nǐ yào zìjǐ qù háishi gēn péngyou yìqǐ qù?","vi":"Bạn muốn tự đi hay đi cùng bạn?","ch":["你","要","自己","去","还是","跟","朋友","一起","去"],"fp":"？","ord":true,"alt":[]},{"id":"b16b-b10","lv":"b","src":"doc","zh":"周末我们在家吃饭或者出去吃。","py":"Zhōumò wǒmen zài jiā chīfàn huòzhě chūqu chī.","vi":"Cuối tuần chúng tôi ăn ở nhà hoặc ra ngoài ăn.","ch":["周末","我们","在","家","吃饭","或者","出去","吃"],"fp":"。","ord":true,"alt":["我们周末在家吃饭或者出去吃。"]},{"id":"b16b-a11","lv":"a","src":"doc","zh":"你打算先去邮局寄包裹，还是先到银行取钱？","py":"Nǐ dǎsuàn xiān qù yóujú jì bāoguǒ, háishi xiān dào yínháng qǔ qián?","vi":"Bạn định đến bưu điện gửi bưu kiện trước hay đến ngân hàng rút tiền trước?","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16b-a12","lv":"a","src":"doc","zh":"如果明天下雨，我们可以改在家里看电影，或者去附近的博物馆。","py":"Rúguǒ míngtiān xiàyǔ, wǒmen kěyǐ gǎi zài jiālǐ kàn diànyǐng, huòzhě qù fùjìn de bówùguǎn.","vi":"Nếu ngày mai mưa, chúng ta có thể đổi sang xem phim ở nhà hoặc đi bảo tàng gần đây.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16b-a13","lv":"a","src":"doc","zh":"你是想在中国学习一年，还是打算毕业以后直接去中国工作？","py":"Nǐ shì xiǎng zài Zhōngguó xuéxí yì nián, háishi dǎsuàn bìyè yǐhòu zhíjiē qù Zhōngguó gōngzuò?","vi":"Bạn muốn học ở Trung Quốc một năm hay dự định sau khi tốt nghiệp sẽ sang Trung Quốc làm việc luôn?","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16b-a14","lv":"a","src":"doc","zh":"买衣服的时候，我通常会看质量，或者问售货员有没有便宜一点儿的。","py":"Mǎi yīfu de shíhou, wǒ tōngcháng huì kàn zhìliàng, huòzhě wèn shòuhuòyuán yǒu méiyǒu piányi yìdiǎnr de.","vi":"Khi mua quần áo, tôi thường xem chất lượng hoặc hỏi nhân viên bán hàng có loại rẻ hơn một chút không.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16b-a15","lv":"a","src":"doc","zh":"你可以把资料发给我，或者明天上课的时候直接拿给老师。","py":"Nǐ kěyǐ bǎ zīliào fā gěi wǒ, huòzhě míngtiān shàngkè de shíhou zhíjiē ná gěi lǎoshī.","vi":"Bạn có thể gửi tài liệu cho tôi hoặc ngày mai khi lên lớp thì đưa trực tiếp cho giáo viên.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16b-a16","lv":"a","src":"doc","zh":"这次旅行我们是坐火车去，还是租一辆车自己开过去？","py":"Zhè cì lǚxíng wǒmen shì zuò huǒchē qù, háishi zū yí liàng chē zìjǐ kāi guòqu?","vi":"Chuyến đi lần này chúng ta đi tàu hỏa hay thuê một chiếc xe tự lái đến đó?","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16b-a17","lv":"a","src":"doc","zh":"他周末不一定在家，可能去运动，或者跟同事一起吃饭。","py":"Tā zhōumò bù yídìng zài jiā, kěnéng qù yùndòng, huòzhě gēn tóngshì yìqǐ chīfàn.","vi":"Cuối tuần anh ấy không nhất thiết ở nhà, có thể đi tập thể thao hoặc ăn cơm cùng đồng nghiệp.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16b-a18","lv":"a","src":"doc","zh":"我还没决定是买这本词典，还是先借朋友的词典用一段时间。","py":"Wǒ hái méi juédìng shì mǎi zhè běn cídiǎn, háishi xiān jiè péngyou de cídiǎn yòng yí duàn shíjiān.","vi":"Tôi vẫn chưa quyết định mua quyển từ điển này hay mượn từ điển của bạn dùng một thời gian trước.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16b-a19","lv":"a","src":"doc","zh":"参加活动的人可以选择上午到场，或者下午有空的时候再来。","py":"Cānjiā huódòng de rén kěyǐ xuǎnzé shàngwǔ dàochǎng, huòzhě xiàwǔ yǒu kòng de shíhou zài lái.","vi":"Người tham gia hoạt động có thể chọn đến vào buổi sáng hoặc chiều khi rảnh rồi đến.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b16b-a20","lv":"a","src":"doc","zh":"你想先把语法复习一遍，还是先做练习题，最后再一起检查答案？","py":"Nǐ xiǎng xiān bǎ yǔfǎ fùxí yí biàn, háishi xiān zuò liànxítí, zuìhòu zài yìqǐ jiǎnchá dá'àn?","vi":"Bạn muốn ôn ngữ pháp một lượt trước hay làm bài tập trước, cuối cùng chúng ta cùng kiểm tra đáp án?","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"b17a","n":3,"lesson":"17","zh":"在/正/正在 + 动词 (+ 呢)","vi":"在 / 正 / 正在 + động từ (+ 呢) – Hành động đang diễn ra","use":"Diễn tả hành động đang tiến hành tại thời điểm nói.","formula":"S + 在/正/正在 + V + O (+ 呢); hoặc S + V + O + 呢. Phủ định: S + 没(有) + 在 + V + O.","note":"正 nhấn mạnh đúng thời điểm; 正在 nhấn mạnh quá trình đang diễn ra. Không dùng mẫu này với động từ trạng thái/phi hành động như 是、有、认识. Phân biệt 在 là động từ \"ở\" và 在 là phó từ \"đang\". Chỉ dùng 呢 ở cuối câu (không có 在/正) cũng có thể diễn tả đang diễn ra: 外边下雨呢。","cmp":false,"ex":[{"id":"b17a-b01","lv":"b","src":"doc","zh":"我在看书呢。","py":"Wǒ zài kàn shū ne.","vi":"Tôi đang đọc sách đây.","ch":["我","在","看","书","呢"],"fp":"。","ord":true,"alt":[]},{"id":"b17a-b02","lv":"b","src":"doc","zh":"他正在听音乐。","py":"Tā zhèngzài tīng yīnyuè.","vi":"Anh ấy đang nghe nhạc.","ch":["他","正在","听","音乐"],"fp":"。","ord":true,"alt":[]},{"id":"b17a-b03","lv":"b","src":"doc","zh":"妈妈在做饭呢。","py":"Māma zài zuò fàn ne.","vi":"Mẹ đang nấu cơm.","ch":["妈妈","在","做","饭","呢"],"fp":"。","ord":true,"alt":[]},{"id":"b17a-b04","lv":"b","src":"doc","zh":"他们正在上课。","py":"Tāmen zhèngzài shàngkè.","vi":"Họ đang học.","ch":["他们","正在","上课"],"fp":"。","ord":true,"alt":[]},{"id":"b17a-b05","lv":"b","src":"doc","zh":"你在做什么呢？","py":"Nǐ zài zuò shénme ne?","vi":"Bạn đang làm gì vậy?","ch":["你","在","做","什么","呢"],"fp":"？","ord":true,"alt":[]},{"id":"b17a-b06","lv":"b","src":"doc","zh":"我没有在睡觉。","py":"Wǒ méiyǒu zài shuìjiào.","vi":"Tôi không đang ngủ.","ch":["我","没有","在","睡觉"],"fp":"。","ord":true,"alt":[]},{"id":"b17a-b07","lv":"b","src":"doc","zh":"姐姐正写汉字呢。","py":"Jiějie zhèng xiě Hànzì ne.","vi":"Chị gái đang viết chữ Hán.","ch":["姐姐","正","写","汉字呢"],"fp":"。","ord":true,"alt":[]},{"id":"b17a-b08","lv":"b","src":"doc","zh":"孩子们在公园里玩儿。","py":"Háizimen zài gōngyuán lǐ wánr.","vi":"Bọn trẻ đang chơi trong công viên.","ch":["孩子们","在","公园","里","玩儿"],"fp":"。","ord":true,"alt":[]},{"id":"b17a-b09","lv":"b","src":"doc","zh":"老师正在教我们语法。","py":"Lǎoshī zhèngzài jiāo wǒmen yǔfǎ.","vi":"Giáo viên đang dạy chúng tôi ngữ pháp.","ch":["老师","正在","教","我们","语法"],"fp":"。","ord":true,"alt":[]},{"id":"b17a-b10","lv":"b","src":"doc","zh":"外边下雨呢。","py":"Wàibian xiàyǔ ne.","vi":"Ngoài trời đang mưa.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17a-a11","lv":"a","src":"doc","zh":"我给你打电话的时候，你是不是正在开会？","py":"Wǒ gěi nǐ dǎ diànhuà de shíhou, nǐ shì bú shì zhèngzài kāihuì?","vi":"Lúc tôi gọi điện cho bạn, có phải bạn đang họp không?","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17a-a12","lv":"a","src":"doc","zh":"妹妹在房间里复习明天的考试，爸爸正在厨房准备晚饭。","py":"Mèimei zài fángjiān lǐ fùxí míngtiān de kǎoshì, bàba zhèngzài chúfáng zhǔnbèi wǎnfàn.","vi":"Em gái đang ôn bài thi ngày mai trong phòng, bố đang chuẩn bị bữa tối trong bếp.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17a-a13","lv":"a","src":"doc","zh":"我们到电影院的时候，电影已经开始了，观众都在认真地看。","py":"Wǒmen dào diànyǐngyuàn de shíhou, diànyǐng yǐjīng kāishǐ le, guānzhòng dōu zài rènzhēn de kàn.","vi":"Khi chúng tôi đến rạp, phim đã bắt đầu, khán giả đều đang chăm chú xem.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17a-a14","lv":"a","src":"doc","zh":"外面虽然下着大雨，但是孩子们还在操场上踢足球。","py":"Wàimian suīrán xiàzhe dàyǔ, dànshì háizimen hái zài cāochǎng shàng tī zúqiú.","vi":"Bên ngoài tuy đang mưa to nhưng bọn trẻ vẫn đá bóng trên sân.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17a-a15","lv":"a","src":"doc","zh":"老师进教室的时候，我们正在讨论课文里的一个重要问题。","py":"Lǎoshī jìn jiàoshì de shíhou, wǒmen zhèngzài tǎolùn kèwén lǐ de yí ge zhòngyào wèntí.","vi":"Khi giáo viên bước vào lớp, chúng tôi đang thảo luận một vấn đề quan trọng trong bài khóa.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17a-a16","lv":"a","src":"doc","zh":"他最近没有在公司上班，而是在家里准备研究生考试。","py":"Tā zuìjìn méiyǒu zài gōngsī shàngbān, ér shì zài jiālǐ zhǔnbèi yánjiūshēng kǎoshì.","vi":"Gần đây anh ấy không làm việc ở công ty mà đang chuẩn bị kỳ thi cao học ở nhà.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17a-a17","lv":"a","src":"doc","zh":"请你等一会儿，经理正在跟客户谈合同，暂时不能接电话。","py":"Qǐng nǐ děng yíhuìr, jīnglǐ zhèngzài gēn kèhù tán hétong, zànshí bù néng jiē diànhuà.","vi":"Bạn vui lòng đợi một lát, giám đốc đang bàn hợp đồng với khách hàng nên tạm thời không thể nghe điện thoại.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17a-a18","lv":"a","src":"doc","zh":"我回宿舍的时候，室友正在洗衣服，另一个同学在阳台上打电话。","py":"Wǒ huí sùshè de shíhou, shìyǒu zhèngzài xǐ yīfu, lìng yí ge tóngxué zài yángtái shàng dǎ diànhuà.","vi":"Khi tôi về ký túc xá, bạn cùng phòng đang giặt quần áo, một bạn học khác đang gọi điện ngoài ban công.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17a-a19","lv":"a","src":"doc","zh":"别打扰他，他正在准备明天的报告，已经忙了一个下午。","py":"Bié dǎrǎo tā, tā zhèngzài zhǔnbèi míngtiān de bàogào, yǐjīng máng le yí ge xiàwǔ.","vi":"Đừng làm phiền anh ấy, anh ấy đang chuẩn bị báo cáo ngày mai và đã bận cả buổi chiều.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17a-a20","lv":"a","src":"doc","zh":"我们走进图书馆时，很多学生正在查资料，也有人在电脑上写作业。","py":"Wǒmen zǒu jìn túshūguǎn shí, hěn duō xuésheng zhèngzài chá zīliào, yě yǒu rén zài diànnǎo shàng xiě zuòyè.","vi":"Khi chúng tôi bước vào thư viện, nhiều sinh viên đang tra tài liệu, cũng có người đang làm bài tập trên máy tính.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"b17b","n":4,"lesson":"17","zh":"双宾语句","vi":"Câu hai tân ngữ","use":"Một số động từ có thể mang hai tân ngữ: tân ngữ chỉ người đứng trước, tân ngữ chỉ vật/thông tin đứng sau.","formula":"S + V + người nhận + vật/thông tin. Động từ thường gặp trong bài: 教、给、借、还、问、回答、告诉. Cũng gặp 送; dạng V + 给 (送给、发给、借给、还给) cũng mang hai tân ngữ: 发给每个学生一张通知.","note":"Trật tự thông thường là người trước, vật sau: 给我一本书, 教我们汉语. Không đảo thành 给一本书我. 给 đứng trước động từ như 给朋友写信 là giới từ (viết thư cho bạn), không phải câu hai tân ngữ. 借 dễ gây nhầm giữa “cho mượn” và “mượn”; dùng 借给 để chỉ rõ là cho mượn.","cmp":false,"ex":[{"id":"b17b-b01","lv":"b","src":"doc","zh":"老师教我们汉语。","py":"Lǎoshī jiāo wǒmen Hànyǔ.","vi":"Giáo viên dạy chúng tôi tiếng Trung.","ch":["老师","教","我们","汉语"],"fp":"。","ord":true,"alt":[]},{"id":"b17b-b02","lv":"b","src":"doc","zh":"妈妈给我一杯水。","py":"Māma gěi wǒ yì bēi shuǐ.","vi":"Mẹ đưa tôi một cốc nước.","ch":["妈妈","给","我","一杯","水"],"fp":"。","ord":true,"alt":[]},{"id":"b17b-b03","lv":"b","src":"doc","zh":"我问老师一个问题。","py":"Wǒ wèn lǎoshī yí ge wèntí.","vi":"Tôi hỏi giáo viên một câu hỏi.","ch":["我","问","老师","一个","问题"],"fp":"。","ord":true,"alt":[]},{"id":"b17b-b04","lv":"b","src":"doc","zh":"他告诉我一个好消息。","py":"Tā gàosu wǒ yí ge hǎo xiāoxi.","vi":"Anh ấy nói cho tôi một tin tốt.","ch":["他","告诉","我","一个","好","消息"],"fp":"。","ord":true,"alt":[]},{"id":"b17b-b05","lv":"b","src":"doc","zh":"请你借我一本词典。","py":"Qǐng nǐ jiè wǒ yì běn cídiǎn.","vi":"Bạn cho tôi mượn một quyển từ điển nhé.","ch":["请","你","借","我","一本","词典"],"fp":"。","ord":true,"alt":[]},{"id":"b17b-b06","lv":"b","src":"doc","zh":"我还他十块钱。","py":"Wǒ huán tā shí kuài qián.","vi":"Tôi trả anh ấy 10 tệ.","ch":["我","还","他","十块","钱"],"fp":"。","ord":true,"alt":[]},{"id":"b17b-b07","lv":"b","src":"doc","zh":"爸爸给妹妹一件礼物。","py":"Bàba gěi mèimei yí jiàn lǐwù.","vi":"Bố tặng em gái một món quà.","ch":["爸爸","给","妹妹","一件","礼物"],"fp":"。","ord":true,"alt":[]},{"id":"b17b-b08","lv":"b","src":"doc","zh":"王老师回答我们一个问题。","py":"Wáng lǎoshī huídá wǒmen yí ge wèntí.","vi":"Thầy Vương trả lời chúng tôi một câu hỏi.","ch":["王","老师","回答","我们","一个","问题"],"fp":"。","ord":true,"alt":[]},{"id":"b17b-b09","lv":"b","src":"doc","zh":"姐姐教我做中国菜。","py":"Jiějie jiāo wǒ zuò Zhōngguó cài.","vi":"Chị gái dạy tôi nấu món Trung Quốc.","ch":["姐姐","教","我","做","中国","菜"],"fp":"。","ord":true,"alt":[]},{"id":"b17b-b10","lv":"b","src":"doc","zh":"他送朋友一本书。","py":"Tā sòng péngyou yì běn shū.","vi":"Anh ấy tặng bạn một quyển sách.","ch":["他","送","朋友","一","本","书"],"fp":"。","ord":true,"alt":[]},{"id":"b17b-a11","lv":"a","src":"doc","zh":"王老师每个星期都教我们两篇课文，还问我们一些问题。","py":"Wáng lǎoshī měi ge xīngqī dōu jiāo wǒmen liǎng piān kèwén, hái wèn wǒmen yìxiē wèntí.","vi":"Mỗi tuần thầy Vương đều dạy chúng tôi hai bài khóa, còn hỏi chúng tôi một số câu hỏi.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17b-a12","lv":"a","src":"doc","zh":"昨天经理告诉大家一个消息，公司下个月要搬到新的办公室。","py":"Zuótiān jīnglǐ gàosu dàjiā yí ge xiāoxi, gōngsī xià ge yuè yào bān dào xīn de bàngōngshì.","vi":"Hôm qua giám đốc thông báo cho mọi người một tin: tháng sau công ty sẽ chuyển đến văn phòng mới.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17b-a13","lv":"a","src":"doc","zh":"我想请你帮我问老师一个问题，因为我还不太明白这个语法。","py":"Wǒ xiǎng qǐng nǐ bāng wǒ wèn lǎoshī yí ge wèntí, yīnwèi wǒ hái bú tài míngbai zhège yǔfǎ.","vi":"Tôi muốn nhờ bạn hỏi giáo viên giúp tôi một câu vì tôi vẫn chưa hiểu lắm ngữ pháp này.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17b-a14","lv":"a","src":"doc","zh":"她发给每个学生一张考试通知，上面写着考试的时间和地点。","py":"Tā fā gěi měi ge xuésheng yì zhāng kǎoshì tōngzhī, shàngmian xiězhe kǎoshì de shíjiān hé dìdiǎn.","vi":"Cô ấy phát cho mỗi học sinh một tờ thông báo thi, trên đó ghi thời gian và địa điểm thi.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17b-a15","lv":"a","src":"doc","zh":"这位中国老师教外国学生汉语已经十多年了，大家都很喜欢他的课。","py":"Zhè wèi Zhōngguó lǎoshī jiāo wàiguó xuésheng Hànyǔ yǐjīng shí duō nián le, dàjiā dōu hěn xǐhuan tā de kè.","vi":"Vị giáo viên Trung Quốc này đã dạy tiếng Trung cho học sinh nước ngoài hơn mười năm, mọi người đều rất thích giờ học của thầy/cô ấy.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17b-a16","lv":"a","src":"doc","zh":"朋友昨天借我一本介绍日本文化的书，我打算这个星期看完以后还给他。","py":"Péngyou zuótiān jiè wǒ yì běn jièshào Rìběn wénhuà de shū, wǒ dǎsuàn zhège xīngqī kàn wán yǐhòu huán gěi tā.","vi":"Hôm qua bạn cho tôi mượn một quyển sách giới thiệu văn hóa Nhật Bản; tôi định đọc xong trong tuần này rồi trả bạn.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17b-a17","lv":"a","src":"doc","zh":"老师回答了我们提出的几个问题，还告诉我们应该怎样准备下次考试。","py":"Lǎoshī huídá le wǒmen tíchū de jǐ ge wèntí, hái gàosu wǒmen yīnggāi zěnyàng zhǔnbèi xià cì kǎoshì.","vi":"Giáo viên đã trả lời vài câu hỏi chúng tôi nêu ra, còn nói cho chúng tôi biết nên chuẩn bị kỳ thi lần tới thế nào.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17b-a18","lv":"a","src":"doc","zh":"请你把会议的具体时间告诉我，我好提前安排明天的工作。","py":"Qǐng nǐ bǎ huìyì de jùtǐ shíjiān gàosu wǒ, wǒ hǎo tíqián ānpái míngtiān de gōngzuò.","vi":"Bạn hãy cho tôi biết thời gian cụ thể của cuộc họp để tôi sắp xếp công việc ngày mai trước.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17b-a19","lv":"a","src":"doc","zh":"父亲每年生日都会送母亲一束花，虽然礼物不贵，但是她很高兴。","py":"Fùqīn měi nián shēngrì dōu huì sòng mǔqin yí shù huā, suīrán lǐwù bú guì, dànshì tā hěn gāoxìng.","vi":"Mỗi dịp sinh nhật hằng năm, bố đều tặng mẹ một bó hoa; tuy món quà không đắt nhưng mẹ rất vui.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b17b-a20","lv":"a","src":"doc","zh":"导游告诉游客，附近有一个很值得参观的博物馆，还问大家想不想去。","py":"Dǎoyóu gàosu yóukè, fùjìn yǒu yí ge hěn zhídé cānguān de bówùguǎn, hái wèn dàjiā xiǎng bu xiǎng qù.","vi":"Hướng dẫn viên nói cho du khách biết gần đây có một bảo tàng rất đáng tham quan, còn hỏi mọi người có muốn đi không.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"b18a","n":5,"lesson":"18","zh":"连动句","vi":"Câu liên động","use":"Hai hay nhiều động từ cùng chung chủ ngữ, diễn tả mục đích, trình tự hoặc phương thức hành động.","formula":"Mục đích: S + 去/来 + địa điểm + V mục đích. Phương thức: S + phương tiện/cách thức + V chính.","note":"Sắp xếp động từ theo trật tự logic; không đảo tùy tiện động từ mục đích lên trước 去/来.","cmp":false,"ex":[{"id":"b18a-b01","lv":"b","src":"doc","zh":"我去邮局寄包裹。","py":"Wǒ qù yóujú jì bāoguǒ.","vi":"Tôi đến bưu điện gửi bưu kiện.","ch":["我","去","邮局","寄","包裹"],"fp":"。","ord":true,"alt":[]},{"id":"b18a-b02","lv":"b","src":"doc","zh":"他来中国学习汉语。","py":"Tā lái Zhōngguó xuéxí Hànyǔ.","vi":"Anh ấy đến Trung Quốc học tiếng Trung.","ch":["他","来","中国","学习","汉语"],"fp":"。","ord":true,"alt":[]},{"id":"b18a-b03","lv":"b","src":"doc","zh":"我坐车去学校。","py":"Wǒ zuò chē qù xuéxiào.","vi":"Tôi đi xe đến trường.","ch":["我","坐","车","去","学校"],"fp":"。","ord":true,"alt":[]},{"id":"b18a-b04","lv":"b","src":"doc","zh":"她骑车去商店买东西。","py":"Tā qí chē qù shāngdiàn mǎi dōngxi.","vi":"Cô ấy đạp xe đến cửa hàng mua đồ.","ch":["她","骑","车","去","商店","买","东西"],"fp":"。","ord":true,"alt":[]},{"id":"b18a-b05","lv":"b","src":"doc","zh":"我们去图书馆借书。","py":"Wǒmen qù túshūguǎn jiè shū.","vi":"Chúng tôi đến thư viện mượn sách.","ch":["我们","去","图书馆","借","书"],"fp":"。","ord":true,"alt":[]},{"id":"b18a-b06","lv":"b","src":"doc","zh":"他用汉语跟老师谈话。","py":"Tā yòng Hànyǔ gēn lǎoshī tánhuà.","vi":"Anh ấy dùng tiếng Trung nói chuyện với giáo viên.","ch":["他","用","汉语","跟","老师","谈话"],"fp":"。","ord":true,"alt":[]},{"id":"b18a-b07","lv":"b","src":"doc","zh":"妈妈去市场买菜。","py":"Māma qù shìchǎng mǎi cài.","vi":"Mẹ đi chợ mua rau.","ch":["妈妈","去","市场","买","菜"],"fp":"。","ord":true,"alt":[]},{"id":"b18a-b08","lv":"b","src":"doc","zh":"我走路去银行取钱。","py":"Wǒ zǒu lù qù yínháng qǔ qián.","vi":"Tôi đi bộ đến ngân hàng rút tiền.","ch":["我","走","路","去","银行","取","钱"],"fp":"。","ord":true,"alt":[]},{"id":"b18a-b09","lv":"b","src":"doc","zh":"朋友来我家看我。","py":"Péngyou lái wǒ jiā kàn wǒ.","vi":"Bạn đến nhà tôi thăm tôi.","ch":["朋友","来","我","家","看","我"],"fp":"。","ord":true,"alt":[]},{"id":"b18a-b10","lv":"b","src":"doc","zh":"他去机场接朋友。","py":"Tā qù jīchǎng jiē péngyou.","vi":"Anh ấy đến sân bay đón bạn.","ch":["他","去","机场","接","朋友"],"fp":"。","ord":true,"alt":[]},{"id":"b18a-a11","lv":"a","src":"doc","zh":"明天我打算先去银行取钱，再到邮局给家里寄一个包裹。","py":"Míngtiān wǒ dǎsuàn xiān qù yínháng qǔ qián, zài dào yóujú gěi jiālǐ jì yí ge bāoguǒ.","vi":"Ngày mai tôi định đến ngân hàng rút tiền trước, sau đó đến bưu điện gửi một bưu kiện về nhà.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18a-a12","lv":"a","src":"doc","zh":"为了提高汉语水平，他每天坐地铁去学校上课，晚上还在宿舍复习两个小时。","py":"Wèile tígāo Hànyǔ shuǐpíng, tā měitiān zuò dìtiě qù xuéxiào shàngkè, wǎnshang hái zài sùshè fùxí liǎng ge xiǎoshí.","vi":"Để nâng cao trình độ tiếng Trung, mỗi ngày anh ấy đi tàu điện ngầm đến trường học, tối còn ôn bài hai tiếng ở ký túc xá.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18a-a13","lv":"a","src":"doc","zh":"我想去书店买一本词典，顺便替同学买几支写汉字用的笔。","py":"Wǒ xiǎng qù shūdiàn mǎi yì běn cídiǎn, shùnbiàn tì tóngxué mǎi jǐ zhī xiě Hànzì yòng de bǐ.","vi":"Tôi muốn đến hiệu sách mua một quyển từ điển, tiện thể mua giúp bạn học vài chiếc bút dùng để viết chữ Hán.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18a-a14","lv":"a","src":"doc","zh":"他每天骑自行车去公司上班，因为坐公共汽车要花很长时间。","py":"Tā měitiān qí zìxíngchē qù gōngsī shàngbān, yīnwèi zuò gōnggòng qìchē yào huā hěn cháng shíjiān.","vi":"Hằng ngày anh ấy đạp xe đến công ty làm việc vì đi xe buýt sẽ mất rất nhiều thời gian.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18a-a15","lv":"a","src":"doc","zh":"我们准备周末去博物馆参观，了解一下这个城市的历史和文化。","py":"Wǒmen zhǔnbèi zhōumò qù bówùguǎn cānguān, liǎojiě yíxià zhège chéngshì de lìshǐ hé wénhuà.","vi":"Chúng tôi chuẩn bị cuối tuần đến bảo tàng tham quan, tìm hiểu một chút về lịch sử và văn hóa thành phố này.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18a-a16","lv":"a","src":"doc","zh":"她坐飞机去上海参加会议，会议结束以后还要去看望一位老朋友。","py":"Tā zuò fēijī qù Shànghǎi cānjiā huìyì, huìyì jiéshù yǐhòu hái yào qù kànwàng yí wèi lǎo péngyou.","vi":"Cô ấy đi máy bay đến Thượng Hải dự hội nghị, sau khi hội nghị kết thúc còn phải đi thăm một người bạn cũ.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18a-a17","lv":"a","src":"doc","zh":"爸爸下班以后先去超市买水果，再回家给我们做晚饭。","py":"Bàba xiàbān yǐhòu xiān qù chāoshì mǎi shuǐguǒ, zài huí jiā gěi wǒmen zuò wǎnfàn.","vi":"Sau khi tan làm, bố đến siêu thị mua hoa quả trước rồi về nhà nấu bữa tối cho chúng tôi.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18a-a18","lv":"a","src":"doc","zh":"为了不迟到，我们决定提前半个小时出门，坐地铁去机场接客人。","py":"Wèile bù chídào, wǒmen juédìng tíqián bàn ge xiǎoshí chūmén, zuò dìtiě qù jīchǎng jiē kèrén.","vi":"Để không đến muộn, chúng tôi quyết định ra khỏi nhà sớm nửa tiếng và đi tàu điện ngầm đến sân bay đón khách.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18a-a19","lv":"a","src":"doc","zh":"他来日本工作以后，常常利用周末去不同的城市旅行、拍照。","py":"Tā lái Rìběn gōngzuò yǐhòu, chángcháng lìyòng zhōumò qù bù tóng de chéngshì lǚxíng, pāizhào.","vi":"Sau khi đến Nhật Bản làm việc, anh ấy thường tranh thủ cuối tuần đi du lịch và chụp ảnh ở các thành phố khác nhau.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18a-a20","lv":"a","src":"doc","zh":"我准备先在网上查资料，再去图书馆借几本书，认真写完这份报告。","py":"Wǒ zhǔnbèi xiān zài wǎngshàng chá zīliào, zài qù túshūguǎn jiè jǐ běn shū, rènzhēn xiě wán zhè fèn bàogào.","vi":"Tôi định tra tài liệu trên mạng trước, sau đó đến thư viện mượn vài quyển sách và nghiêm túc hoàn thành bản báo cáo này.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"b18b","n":6,"lesson":"18","zh":"替/给/帮","vi":"替 / 给 / 帮 – Thay, cho, giúp","use":"Đặt trước người được thay/được giúp/nhận lợi ích.","formula":"S + 替/给/帮 + người + V + O.","note":"替 nhấn mạnh làm thay; 给 nhấn mạnh làm cho/hướng đến người nhận; 帮 nhấn mạnh giúp đỡ. Tùy động từ và ngữ cảnh mà chọn từ phù hợp.","cmp":false,"ex":[{"id":"b18b-b01","lv":"b","src":"doc","zh":"我替你买票。","py":"Wǒ tì nǐ mǎi piào.","vi":"Tôi mua vé thay/giúp bạn.","ch":["我","替","你","买","票"],"fp":"。","ord":true,"alt":[]},{"id":"b18b-b02","lv":"b","src":"doc","zh":"请帮我开门。","py":"Qǐng bāng wǒ kāi mén.","vi":"Hãy giúp tôi mở cửa.","ch":["请","帮","我","开","门"],"fp":"。","ord":true,"alt":[]},{"id":"b18b-b03","lv":"b","src":"doc","zh":"妈妈给我做饭。","py":"Māma gěi wǒ zuò fàn.","vi":"Mẹ nấu cơm cho tôi.","ch":["妈妈","给","我","做","饭"],"fp":"。","ord":true,"alt":[]},{"id":"b18b-b04","lv":"b","src":"doc","zh":"他替老师拿书。","py":"Tā tì lǎoshī ná shū.","vi":"Anh ấy cầm sách giúp thầy.","ch":["他","替","老师","拿","书"],"fp":"。","ord":true,"alt":[]},{"id":"b18b-b05","lv":"b","src":"doc","zh":"你能帮我查资料吗？","py":"Nǐ néng bāng wǒ chá zīliào ma?","vi":"Bạn có thể giúp tôi tra tài liệu không?","ch":["你","能","帮","我","查","资料吗"],"fp":"？","ord":true,"alt":[]},{"id":"b18b-b06","lv":"b","src":"doc","zh":"我给朋友写信。","py":"Wǒ gěi péngyou xiě xìn.","vi":"Tôi viết thư cho bạn.","ch":["我","给","朋友","写","信"],"fp":"。","ord":true,"alt":[]},{"id":"b18b-b07","lv":"b","src":"doc","zh":"请你帮我拿一下这个包。","py":"Qǐng nǐ bāng wǒ ná yíxià zhège bāo.","vi":"Bạn giúp tôi cầm chiếc túi này một chút nhé.","ch":["请","你","帮","我","拿","一下","这个","包"],"fp":"。","ord":true,"alt":[]},{"id":"b18b-b08","lv":"b","src":"doc","zh":"姐姐替我买了一件衣服。","py":"Jiějie tì wǒ mǎi le yí jiàn yīfu.","vi":"Chị gái mua giúp tôi một bộ quần áo.","ch":["姐姐","替","我","买了","一件","衣服"],"fp":"。","ord":true,"alt":[]},{"id":"b18b-b09","lv":"b","src":"doc","zh":"爸爸给孩子讲故事。","py":"Bàba gěi háizi jiǎng gùshi.","vi":"Bố kể chuyện cho con.","ch":["爸爸","给","孩子","讲","故事"],"fp":"。","ord":true,"alt":[]},{"id":"b18b-b10","lv":"b","src":"doc","zh":"同学帮我复习汉语。","py":"Tóngxué bāng wǒ fùxí Hànyǔ.","vi":"Bạn học giúp tôi ôn tiếng Trung.","ch":["同学","帮","我","复习","汉语"],"fp":"。","ord":true,"alt":[]},{"id":"b18b-a11","lv":"a","src":"doc","zh":"我今天要加班，能不能请你替我去邮局寄一下这个包裹？","py":"Wǒ jīntiān yào jiābān, néng bu néng qǐng nǐ tì wǒ qù yóujú jì yíxià zhège bāoguǒ?","vi":"Hôm nay tôi phải tăng ca, có thể nhờ bạn đi bưu điện gửi giúp tôi bưu kiện này không?","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18b-a12","lv":"a","src":"doc","zh":"如果你不知道这个汉字怎么读，我可以帮你查一下词典。","py":"Rúguǒ nǐ bù zhīdào zhège Hànzì zěnme dú, wǒ kěyǐ bāng nǐ chá yíxià cídiǎn.","vi":"Nếu bạn không biết chữ Hán này đọc thế nào, tôi có thể giúp bạn tra từ điển.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18b-a13","lv":"a","src":"doc","zh":"妈妈每天早上给我们准备早饭，还替爸爸把午饭装进饭盒里。","py":"Māma měitiān zǎoshang gěi wǒmen zhǔnbèi zǎofàn, hái tì bàba bǎ wǔfàn zhuāng jìn fànhé lǐ.","vi":"Mỗi sáng mẹ chuẩn bị bữa sáng cho chúng tôi, còn xếp cơm trưa vào hộp giúp bố.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18b-a14","lv":"a","src":"doc","zh":"我刚到日本的时候，邻居帮我熟悉附近的商店、车站和医院。","py":"Wǒ gāng dào Rìběn de shíhou, línjū bāng wǒ shúxī fùjìn de shāngdiàn, chēzhàn hé yīyuàn.","vi":"Khi tôi mới đến Nhật Bản, hàng xóm giúp tôi làm quen với các cửa hàng, nhà ga và bệnh viện gần đó.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18b-a15","lv":"a","src":"doc","zh":"这份文件很重要，请你帮经理检查一遍，看看有没有写错的地方。","py":"Zhè fèn wénjiàn hěn zhòngyào, qǐng nǐ bāng jīnglǐ jiǎnchá yí biàn, kànkan yǒu méiyǒu xiě cuò de dìfang.","vi":"Tài liệu này rất quan trọng, bạn hãy giúp giám đốc kiểm tra một lượt xem có chỗ nào viết sai không.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18b-a16","lv":"a","src":"doc","zh":"她今天不能参加会议，所以请同事替她向大家说明原因。","py":"Tā jīntiān bù néng cānjiā huìyì, suǒyǐ qǐng tóngshì tì tā xiàng dàjiā shuōmíng yuányīn.","vi":"Hôm nay cô ấy không thể tham gia cuộc họp nên nhờ đồng nghiệp giải thích nguyên nhân với mọi người thay cô ấy.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18b-a17","lv":"a","src":"doc","zh":"我想给在中国学习的朋友寄一些日本的点心，让他尝尝家乡以外的味道。","py":"Wǒ xiǎng gěi zài Zhōngguó xuéxí de péngyou jì yìxiē Rìběn de diǎnxin, ràng tā chángchang jiāxiāng yǐwài de wèidào.","vi":"Tôi muốn gửi một ít bánh kẹo Nhật Bản cho người bạn đang học ở Trung Quốc để bạn ấy nếm thử hương vị khác quê nhà.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18b-a18","lv":"a","src":"doc","zh":"你先帮我把这些书搬到教室，我去办公室给老师送一份资料。","py":"Nǐ xiān bāng wǒ bǎ zhèxiē shū bān dào jiàoshì, wǒ qù bàngōngshì gěi lǎoshī sòng yí fèn zīliào.","vi":"Bạn giúp tôi chuyển những quyển sách này vào lớp trước, tôi đến văn phòng đưa tài liệu cho giáo viên.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18b-a19","lv":"a","src":"doc","zh":"爸爸出差的时候，我常常替他照顾家里的花，还帮妈妈做一些家务。","py":"Bàba chūchāi de shíhou, wǒ chángcháng tì tā zhàogù jiālǐ de huā, hái bāng māma zuò yìxiē jiāwù.","vi":"Khi bố đi công tác, tôi thường chăm sóc hoa ở nhà thay bố, còn giúp mẹ làm một số việc nhà.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b18b-a20","lv":"a","src":"doc","zh":"如果你愿意，我可以帮你把这段中文翻译成越南语，再替你检查一遍语法。","py":"Rúguǒ nǐ yuànyì, wǒ kěyǐ bāng nǐ bǎ zhè duàn Zhōngwén fānyì chéng Yuènányǔ, zài tì nǐ jiǎnchá yí biàn yǔfǎ.","vi":"Nếu bạn muốn, tôi có thể giúp bạn dịch đoạn tiếng Trung này sang tiếng Việt, rồi kiểm tra ngữ pháp giúp bạn một lượt.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"b19a","n":7,"lesson":"19","zh":"动词重叠","vi":"Động từ lặp","use":"Diễn tả hành động trong thời gian ngắn, làm thử, làm nhẹ nhàng hoặc đề nghị thân mật.","formula":"Động từ đơn âm tiết AA / A一A; động từ song âm tiết ABAB. Khi hành động đã xảy ra: A了A (看了看) / A了一A (看了一看) / AB了AB (休息了休息).","note":"Không lặp các động từ chỉ trạng thái như 是、有、在; không dùng dạng lặp trong cấu trúc đang diễn ra 在/正在 + V.","cmp":false,"ex":[{"id":"b19a-b01","lv":"b","src":"doc","zh":"你看看这件衣服。","py":"Nǐ kànkan zhè jiàn yīfu.","vi":"Bạn xem thử bộ quần áo này.","ch":["你","看看","这","件","衣服"],"fp":"。","ord":true,"alt":[]},{"id":"b19a-b02","lv":"b","src":"doc","zh":"我想试一试。","py":"Wǒ xiǎng shì yi shì.","vi":"Tôi muốn thử một chút.","ch":["我","想","试","一","试"],"fp":"。","ord":true,"alt":[] 9a-a13","lv":"a","src":"doc","zh":"到了新城市以后，我们打算先到处走走，熟悉一下周围的环境。","py":"Dào le xīn chéngshì yǐhòu, wǒmen dǎsuàn xiān dàochù zǒuzou, shúxī yíxià zhōuwéi de huánjìng.","vi":"Sau khi đến thành phố mới, chúng tôi định đi dạo khắp nơi trước để làm quen với môi trường xung quanh.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19a-a14","lv":"a","src":"doc","zh":"这本书我已经翻了翻，内容很有意思，准备周末再认真读一遍。","py":"Zhè běn shū wǒ yǐjīng fān le fān, nèiróng hěn yǒu yìsi, zhǔnbèi zhōumò zài rènzhēn dú yí biàn.","vi":"Quyển sách này tôi đã lật xem qua, nội dung rất thú vị, dự định cuối tuần đọc kỹ lại một lượt.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19a-a15","lv":"a","src":"doc","zh":"如果你不知道怎么回答，可以先想一想，不用马上告诉我。","py":"Rúguǒ nǐ bù zhīdào zěnme huídá, kěyǐ xiān xiǎng yi xiǎng, bú yòng mǎshàng gàosu wǒ.","vi":"Nếu bạn không biết trả lời thế nào, có thể suy nghĩ một chút trước, không cần nói với tôi ngay.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19a-a16","lv":"a","src":"doc","zh":"周末没有特别的安排，我们想去附近的公园散散步，拍拍照片。","py":"Zhōumò méiyǒu tèbié de ānpái, wǒmen xiǎng qù fùjìn de gōngyuán sànsan bù, pāipāi zhàopiàn.","vi":"Cuối tuần không có kế hoạch gì đặc biệt, chúng tôi muốn đến công viên gần nhà đi dạo và chụp vài tấm ảnh.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19a-a17","lv":"a","src":"doc","zh":"老师让我们把课文读一读，然后两个人一组练习练习对话。","py":"Lǎoshī ràng wǒmen bǎ kèwén dú yi dú, ránhòu liǎng ge rén yì zǔ liànxí liànxí duìhuà.","vi":"Giáo viên bảo chúng tôi đọc bài khóa một chút, sau đó luyện hội thoại theo cặp.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19a-a18","lv":"a","src":"doc","zh":"我试了试这双鞋，发现大小正合适，所以决定买下来。","py":"Wǒ shì le shi zhè shuāng xié, fāxiàn dàxiǎo zhèng héshì, suǒyǐ juédìng mǎi xiàlai.","vi":"Tôi đã thử đôi giày này và thấy kích cỡ vừa vặn, nên quyết định mua.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19a-a19","lv":"a","src":"doc","zh":"你有时间的话，帮我检查检查这份作业，看看有没有写错的地方。","py":"Nǐ yǒu shíjiān de huà, bāng wǒ jiǎnchá jiǎnchá zhè fèn zuòyè, kànkan yǒu méiyǒu xiě cuò de dìfang.","vi":"Nếu có thời gian, hãy giúp tôi kiểm tra bài tập này xem có chỗ nào viết sai không.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19a-a20","lv":"a","src":"doc","zh":"他每天睡觉以前都会听听音乐，让自己放松下来。","py":"Tā měitiān shuìjiào yǐqián dōu huì tīngting yīnyuè, ràng zìjǐ fàngsōng xiàlai.","vi":"Mỗi ngày trước khi ngủ, anh ấy đều nghe nhạc một chút để thư giãn.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"b19b","n":8,"lesson":"19","zh":"又……又……","vi":"又……又…… – Vừa… vừa…","use":"Nối hai đặc điểm hoặc hai hành động cùng tồn tại.","formula":"S + 又 + A + 又 + B; hoặc S + 又 + V1 + 又 + V2.","note":"Hai vế cần có quan hệ song song, cùng miêu tả một người/vật hoặc một tình huống.","cmp":false,"ex":[{"id":"b19b-b01","lv":"b","src":"doc","zh":"这件衣服又漂亮又便宜。","py":"Zhè jiàn yīfu yòu piàoliang yòu piányi.","vi":"Bộ quần áo này vừa đẹp vừa rẻ.","ch":["这","件","衣服","又","漂亮","又","便宜"],"fp":"。","ord":true,"alt":[]},{"id":"b19b-b02","lv":"b","src":"doc","zh":"他又高又瘦。","py":"Tā yòu gāo yòu shòu.","vi":"Anh ấy vừa cao vừa gầy.","ch":["他","又","高","又","瘦"],"fp":"。","ord":true,"alt":[]},{"id":"b19b-b03","lv":"b","src":"doc","zh":"今天又刮风又下雨。","py":"Jīntiān yòu guāfēng yòu xiàyǔ.","vi":"Hôm nay vừa có gió vừa mưa.","ch":["今天","又","刮风","又","下雨"],"fp":"。","ord":true,"alt":[]},{"id":"b19b-b04","lv":"b","src":"doc","zh":"这个房间又大又干净。","py":"Zhège fángjiān yòu dà yòu gānjìng.","vi":"Căn phòng này vừa rộng vừa sạch.","ch":["这个","房间","又","大","又","干净"],"fp":"。","ord":true,"alt":[]},{"id":"b19b-b05","lv":"b","src":"doc","zh":"她又会唱歌又会跳舞。","py":"Tā yòu huì chànggē yòu huì tiàowǔ.","vi":"Cô ấy vừa biết hát vừa biết nhảy.","ch":["她","又","会","唱歌","又","会","跳舞"],"fp":"。","ord":true,"alt":[]},{"id":"b19b-b06","lv":"b","src":"doc","zh":"这本书又有意思又容易懂。","py":"Zhè běn shū yòu yǒu yìsi yòu róngyì dǒng.","vi":"Quyển sách này vừa thú vị vừa dễ hiểu.","ch":["这","本","书","又","有","意思","又","容易","懂"],"fp":"。","ord":true,"alt":[]},{"id":"b19b-b07","lv":"b","src":"doc","zh":"他又买水果又买面包。","py":"Tā yòu mǎi shuǐguǒ yòu mǎi miànbāo.","vi":"Anh ấy vừa mua hoa quả vừa mua bánh mì.","ch":["他","又","买","水果","又","买","面包"],"fp":"。","ord":true,"alt":[]},{"id":"b19b-b08","lv":"b","src":"doc","zh":"这家饭馆又便宜又好吃。","py":"Zhè jiā fànguǎn yòu piányi yòu hǎochī.","vi":"Quán ăn này vừa rẻ vừa ngon.","ch":["这","家","饭馆","又","便宜","又","好吃"],"fp":"。","ord":true,"alt":[]},{"id":"b19b-b09","lv":"b","src":"doc","zh":"妹妹又聪明又可爱。","py":"Mèimei yòu cōngming yòu kě'ài.","vi":"Em gái vừa thông minh vừa đáng yêu.","ch":["妹妹","又","聪明","又","可爱"],"fp":"。","ord":true,"alt":[]},{"id":"b19b-b10","lv":"b","src":"doc","zh":"他今天又唱歌又跳舞。","py":"Tā jīntiān yòu chànggē yòu tiàowǔ.","vi":"Hôm nay anh ấy vừa hát vừa nhảy.","ch":["他","今天","又","唱歌","又","跳舞"],"fp":"。","ord":true,"alt":["今天他又唱歌又跳舞。"]},{"id":"b19b-a11","lv":"a","src":"doc","zh":"这家商店的衣服又好看又便宜，所以周末常常有很多顾客来买东西。","py":"Zhè jiā shāngdiàn de yīfu yòu hǎokàn yòu piányi, suǒyǐ zhōumò chángcháng yǒu hěn duō gùkè lái mǎi dōngxi.","vi":"Quần áo ở cửa hàng này vừa đẹp vừa rẻ nên cuối tuần thường có rất nhiều khách đến mua sắm.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19b-a12","lv":"a","src":"doc","zh":"虽然这份工作又忙又累，但是我可以学到很多新的知识和经验。","py":"Suīrán zhè fèn gōngzuò yòu máng yòu lèi, dànshì wǒ kěyǐ xué dào hěn duō xīn de zhīshi hé jīngyàn.","vi":"Tuy công việc này vừa bận vừa mệt nhưng tôi có thể học được nhiều kiến thức và kinh nghiệm mới.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19b-a13","lv":"a","src":"doc","zh":"她不仅会说汉语，还会说日语，平时又喜欢唱歌又喜欢旅行。","py":"Tā bùjǐn huì shuō Hànyǔ, hái huì shuō Rìyǔ, píngshí yòu xǐhuan chànggē yòu xǐhuan lǚxíng.","vi":"Cô ấy không những biết nói tiếng Trung mà còn biết tiếng Nhật, bình thường vừa thích hát vừa thích du lịch.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19b-a14","lv":"a","src":"doc","zh":"这座城市的交通又方便又安全，附近还有很多值得参观的地方。","py":"Zhè zuò chéngshì de jiāotōng yòu fāngbiàn yòu ānquán, fùjìn hái yǒu hěn duō zhídé cānguān de dìfang.","vi":"Giao thông ở thành phố này vừa thuận tiện vừa an toàn, gần đó còn có nhiều nơi đáng tham quan.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19b-a15","lv":"a","src":"doc","zh":"他最近又要准备考试，又要完成公司的工作，每天都没有多少休息时间。","py":"Tā zuìjìn yòu yào zhǔnbèi kǎoshì, yòu yào wánchéng gōngsī de gōngzuò, měitiān dōu méiyǒu duōshao xiūxi shíjiān.","vi":"Gần đây anh ấy vừa phải chuẩn bị thi vừa phải hoàn thành công việc công ty, ngày nào cũng không có nhiều thời gian nghỉ ngơi.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19b-a16","lv":"a","src":"doc","zh":"这家饭馆的服务又热情又周到，菜的味道也很好，因此我愿意再来。","py":"Zhè jiā fànguǎn de fúwù yòu rèqíng yòu zhōudào, cài de wèidào yě hěn hǎo, yīncǐ wǒ yuànyì zài lái.","vi":"Dịch vụ của nhà hàng này vừa nhiệt tình vừa chu đáo, món ăn cũng ngon nên tôi sẵn lòng quay lại.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19b-a17","lv":"a","src":"doc","zh":"他又认真又有耐心，遇到困难的时候从来不轻易放弃。","py":"Tā yòu rènzhēn yòu yǒu nàixīn, yùdào kùnnan de shíhou cónglái bù qīngyì fàngqì.","vi":"Anh ấy vừa nghiêm túc vừa kiên nhẫn, khi gặp khó khăn chưa bao giờ dễ dàng bỏ cuộc.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19b-a18","lv":"a","src":"doc","zh":"这次旅行又有意思又让人难忘，我们拍了很多照片，也认识了新朋友。","py":"Zhè cì lǚxíng yòu yǒu yìsi yòu ràng rén nánwàng, wǒmen pāi le hěn duō zhàopiàn, yě rènshi le xīn péngyou.","vi":"Chuyến du lịch lần này vừa thú vị vừa đáng nhớ; chúng tôi chụp nhiều ảnh và còn quen thêm bạn mới.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19b-a19","lv":"a","src":"doc","zh":"这个孩子又会自己吃饭又会整理玩具，父母觉得他进步很大。","py":"Zhège háizi yòu huì zìjǐ chīfàn yòu huì zhěnglǐ wánjù, fùmǔ juéde tā jìnbù hěn dà.","vi":"Đứa trẻ này vừa biết tự ăn cơm vừa biết dọn đồ chơi, cha mẹ cảm thấy bé tiến bộ rất nhiều.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19b-a20","lv":"a","src":"doc","zh":"这个方案又节省时间又减少费用，因此大家讨论以后决定采用它。","py":"Zhège fāng'àn yòu jiéshěng shíjiān yòu jiǎnshǎo fèiyòng, yīncǐ dàjiā tǎolùn yǐhòu juédìng cǎiyòng tā.","vi":"Phương án này vừa tiết kiệm thời gian vừa giảm chi phí, vì vậy sau khi thảo luận mọi người quyết định áp dụng nó.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"b19c","n":9,"lesson":"19","zh":"一点儿 và 有点儿","vi":"一点儿 và 有点儿 – Một chút / Hơi","use":"一点儿 có thể đứng trước danh từ hoặc sau tính từ để biểu thị một chút/mức độ so sánh. 有点儿 đứng trước tính từ/động từ tâm lý, thường biểu thị mức độ hơi không như mong muốn.","formula":"一点儿 + N; Adj + 一点儿; 有点儿 + Adj/V tâm lý.","note":"Không dùng 有点儿 để khen một đặc điểm tích cực theo cách thông thường; nói 很合适 hoặc 正合适, không nói 有点儿合适.","cmp":false,"ex":[{"id":"b19c-b01","lv":"b","src":"doc","zh":"我会说一点儿汉语。","py":"Wǒ huì shuō yìdiǎnr Hànyǔ.","vi":"Tôi biết nói một chút tiếng Trung.","ch":["我","会","说","一点儿","汉语"],"fp":"。","ord":true,"alt":[]},{"id":"b19c-b02","lv":"b","src":"doc","zh":"请给我一点儿水。","py":"Qǐng gěi wǒ yìdiǎnr shuǐ.","vi":"Làm ơn cho tôi một chút nước.","ch":["请","给","我","一点儿","水"],"fp":"。","ord":true,"alt":[]},{"id":"b19c-b03","lv":"b","src":"doc","zh":"这件衣服有点儿长。","py":"Zhè jiàn yīfu yǒudiǎnr cháng.","vi":"Bộ quần áo này hơi dài.","ch":["这","件","衣服","有点儿","长"],"fp":"。","ord":true,"alt":[]},{"id":"b19c-b04","lv":"b","src":"doc","zh":"有没有大一点儿的？","py":"Yǒu méiyǒu dà yìdiǎnr de?","vi":"Có cái lớn hơn một chút không?","ch":["有","没有","大","一点儿的"],"fp":"？","ord":true,"alt":[]},{"id":"b19c-b05","lv":"b","src":"doc","zh":"今天有点儿冷。","py":"Jīntiān yǒudiǎnr lěng.","vi":"Hôm nay hơi lạnh.","ch":["今天","有点儿","冷"],"fp":"。","ord":true,"alt":[]},{"id":"b19c-b06","lv":"b","src":"doc","zh":"请说慢一点儿。","py":"Qǐng shuō màn yìdiǎnr.","vi":"Xin hãy nói chậm hơn một chút.","ch":["请","说","慢","一点儿"],"fp":"。","ord":true,"alt":[]},{"id":"b19c-b07","lv":"b","src":"doc","zh":"这个房间有点儿小。","py":"Zhège fángjiān yǒudiǎnr xiǎo.","vi":"Căn phòng này hơi nhỏ.","ch":["这个","房间","有点儿","小"],"fp":"。","ord":true,"alt":[]},{"id":"b19c-b08","lv":"b","src":"doc","zh":"我想买便宜一点儿的鞋。","py":"Wǒ xiǎng mǎi piányi yìdiǎnr de xié.","vi":"Tôi muốn mua đôi giày rẻ hơn một chút.","ch":["我","想","买","便宜","一点儿的","鞋"],"fp":"。","ord":true,"alt":[]},{"id":"b19c-b09","lv":"b","src":"doc","zh":"他有点儿累。","py":"Tā yǒudiǎnr lèi.","vi":"Anh ấy hơi mệt.","ch":["他","有点儿","累"],"fp":"。","ord":true,"alt":[]},{"id":"b19c-b10","lv":"b","src":"doc","zh":"你再等一会儿，我还有一点儿事。","py":"Nǐ zài děng yíhuìr, wǒ hái yǒu yìdiǎnr shì.","vi":"Bạn đợi thêm một lát, tôi còn chút việc.","ch":["你","再","等","一会儿，","我","还","有","一点儿","事"],"fp":"。","ord":true,"alt":[]},{"id":"b19c-a11","lv":"a","src":"doc","zh":"这件外套的颜色我很喜欢，不过袖子有点儿长，能不能换一件短一点儿的？","py":"Zhè jiàn wàitào de yánsè wǒ hěn xǐhuan, búguò xiùzi yǒudiǎnr cháng, néng bu néng huàn yí jiàn duǎn yìdiǎnr de?","vi":"Tôi rất thích màu chiếc áo khoác này, nhưng tay áo hơi dài, có thể đổi chiếc ngắn hơn một chút không?","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19c-a12","lv":"a","src":"doc","zh":"他说汉语说得有点儿快，如果你没听清楚，可以请他再说慢一点儿。","py":"Tā shuō Hànyǔ shuō de yǒudiǎnr kuài, rúguǒ nǐ méi tīng qīngchu, kěyǐ qǐng tā zài shuō màn yìdiǎnr.","vi":"Anh ấy nói tiếng Trung hơi nhanh; nếu bạn chưa nghe rõ, có thể nhờ anh ấy nói chậm hơn một chút.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19c-a13","lv":"a","src":"doc","zh":"今天的天气有点儿冷，我们最好穿厚一点儿的衣服再出门。","py":"Jīntiān de tiānqì yǒudiǎnr lěng, wǒmen zuì hǎo chuān hòu yìdiǎnr de yīfu zài chūmén.","vi":"Hôm nay thời tiết hơi lạnh, tốt nhất chúng ta mặc quần áo dày hơn một chút rồi hãy ra ngoài.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19c-a14","lv":"a","src":"doc","zh":"这个问题有点儿复杂，我需要一点儿时间查资料，才能给你准确的答案。","py":"Zhège wèntí yǒudiǎnr fùzá, wǒ xūyào yìdiǎnr shíjiān chá zīliào, cái néng gěi nǐ zhǔnquè de dá'àn.","vi":"Vấn đề này hơi phức tạp, tôi cần một chút thời gian tra tài liệu thì mới có thể đưa cho bạn câu trả lời chính xác.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19c-a15","lv":"a","src":"doc","zh":"如果你觉得房间太暗，可以把桌子搬到亮一点儿的地方。","py":"Rúguǒ nǐ juéde fángjiān tài àn, kěyǐ bǎ zhuōzi bān dào liàng yìdiǎnr de dìfang.","vi":"Nếu bạn cảm thấy căn phòng quá tối, có thể chuyển bàn đến nơi sáng hơn một chút.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19c-a16","lv":"a","src":"doc","zh":"我今天身体有点儿不舒服，所以想早点儿回家休息，不参加晚上的活动了。","py":"Wǒ jīntiān shēntǐ yǒudiǎnr bù shūfu, suǒyǐ xiǎng zǎodiǎnr huí jiā xiūxi, bù cānjiā wǎnshang de huódòng le.","vi":"Hôm nay tôi hơi khó chịu trong người nên muốn về nhà nghỉ sớm, không tham gia hoạt động buổi tối nữa.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19c-a17","lv":"a","src":"doc","zh":"这家饭馆的菜有点儿贵，但是分量很足，两个人点三个菜就够了。","py":"Zhè jiā fànguǎn de cài yǒudiǎnr guì, dànshì fènliàng hěn zú, liǎng ge rén diǎn sān ge cài jiù gòu le.","vi":"Món ăn ở nhà hàng này hơi đắt nhưng khẩu phần nhiều, hai người gọi ba món là đủ.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19c-a18","lv":"a","src":"doc","zh":"我觉得这双鞋有点儿小，你能不能帮我找一双大一点儿、舒服一点儿的？","py":"Wǒ juéde zhè shuāng xié yǒudiǎnr xiǎo, nǐ néng bu néng bāng wǒ zhǎo yì shuāng dà yìdiǎnr, shūfu yìdiǎnr de?","vi":"Tôi thấy đôi giày này hơi nhỏ, bạn có thể tìm giúp tôi đôi lớn hơn và thoải mái hơn một chút không?","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19c-a19","lv":"a","src":"doc","zh":"他对中国文化有一点儿了解，但还需要读更多的书，才能真正理解其中的差别。","py":"Tā duì Zhōngguó wénhuà yǒu yìdiǎnr liǎojiě, dàn hái xūyào dú gèng duō de shū, cái néng zhēnzhèng lǐjiě qízhōng de chābié.","vi":"Anh ấy có hiểu biết một chút về văn hóa Trung Quốc, nhưng vẫn cần đọc thêm sách mới thực sự hiểu được những khác biệt trong đó.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19c-a20","lv":"a","src":"doc","zh":"这次考试的听力部分有点儿难，不过只要每天练习一点儿，你一定会慢慢进步。","py":"Zhè cì kǎoshì de tīnglì bùfen yǒudiǎnr nán, búguò zhǐyào měitiān liànxí yìdiǎnr, nǐ yídìng huì mànmàn jìnbù.","vi":"Phần nghe của kỳ thi lần này hơi khó, nhưng chỉ cần mỗi ngày luyện tập một chút, bạn nhất định sẽ dần tiến bộ.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"b19d","n":10,"lesson":"19","zh":"太……了","vi":"太……了 – Quá… rồi","use":"Biểu thị mức độ vượt quá bình thường hoặc cảm thán.","formula":"太 + tính từ/động từ tâm lý + 了.","note":"Có thể biểu thị chê bai (太贵了) hoặc khen ngợi (太好了), tùy ngữ cảnh. Thể phủ định thường dùng 不太 + tính từ (不太贵 = không đắt lắm), không dùng 太…了 để phủ định.","cmp":false,"ex":[{"id":"b19d-b01","lv":"b","src":"doc","zh":"这件衣服太贵了。","py":"Zhè jiàn yīfu tài guì le.","vi":"Bộ quần áo này đắt quá.","ch":["这","件","衣服","太","贵了"],"fp":"。","ord":true,"alt":[]},{"id":"b19d-b02","lv":"b","src":"doc","zh":"今天太热了。","py":"Jīntiān tài rè le.","vi":"Hôm nay nóng quá.","ch":["今天","太","热了"],"fp":"。","ord":true,"alt":[]},{"id":"b19d-b03","lv":"b","src":"doc","zh":"这个房间太小了。","py":"Zhège fángjiān tài xiǎo le.","vi":"Căn phòng này nhỏ quá.","ch":["这个","房间","太","小了"],"fp":"。","ord":true,"alt":[]},{"id":"b19d-b04","lv":"b","src":"doc","zh":"你太好了！","py":"Nǐ tài hǎo le!","vi":"Bạn tốt quá!","ch":["你","太","好了"],"fp":"！","ord":true,"alt":[]},{"id":"b19d-b05","lv":"b","src":"doc","zh":"这本书太有意思了。","py":"Zhè běn shū tài yǒu yìsi le.","vi":"Quyển sách này thú vị quá.","ch":["这","本","书","太","有","意思了"],"fp":"。","ord":true,"alt":[]},{"id":"b19d-b06","lv":"b","src":"doc","zh":"现在太晚了。","py":"Xiànzài tài wǎn le.","vi":"Bây giờ muộn quá rồi.","ch":["现在","太","晚了"],"fp":"。","ord":true,"alt":[]},{"id":"b19d-b07","lv":"b","src":"doc","zh":"这双鞋太大了。","py":"Zhè shuāng xié tài dà le.","vi":"Đôi giày này to quá.","ch":["这","双","鞋","太","大了"],"fp":"。","ord":true,"alt":[]},{"id":"b19d-b08","lv":"b","src":"doc","zh":"今天的考试太难了。","py":"Jīntiān de kǎoshì tài nán le.","vi":"Bài thi hôm nay khó quá.","ch":["今天的","考试","太","难了"],"fp":"。","ord":true,"alt":[]},{"id":"b19d-b09","lv":"b","src":"doc","zh":"这里太安静了。","py":"Zhèlǐ tài ānjìng le.","vi":"Ở đây yên tĩnh quá.","ch":["这里","太","安静了"],"fp":"。","ord":true,"alt":[]},{"id":"b19d-b10","lv":"b","src":"doc","zh":"这个菜太辣了。","py":"Zhège cài tài là le.","vi":"Món này cay quá.","ch":["这个","菜","太","辣了"],"fp":"。","ord":true,"alt":[]},{"id":"b19d-a11","lv":"a","src":"doc","zh":"这家商店的衣服质量不错，但是价格太高了，我还是想再看看别的地方。","py":"Zhè jiā shāngdiàn de yīfu zhìliàng búcuò, dànshì jiàgé tài gāo le, wǒ háishi xiǎng zài kànkan bié de dìfang.","vi":"Quần áo ở cửa hàng này chất lượng khá tốt nhưng giá cao quá, tôi vẫn muốn xem thêm nơi khác.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19d-a12","lv":"a","src":"doc","zh":"昨天晚上我们聊得太晚了，今天早上起床的时候大家都觉得很累。","py":"Zuótiān wǎnshang wǒmen liáo de tài wǎn le, jīntiān zǎoshang qǐchuáng de shíhou dàjiā dōu juéde hěn lèi.","vi":"Tối qua chúng tôi trò chuyện quá muộn, sáng nay khi thức dậy ai cũng cảm thấy mệt.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19d-a13","lv":"a","src":"doc","zh":"这次旅行太有意思了，不但看到了很多美丽的风景，还认识了不少新朋友。","py":"Zhè cì lǚxíng tài yǒu yìsi le, búdàn kàn dào le hěn duō měilì de fēngjǐng, hái rènshi le bù shǎo xīn péngyou.","vi":"Chuyến du lịch lần này thú vị quá, không những được ngắm nhiều phong cảnh đẹp mà còn quen thêm khá nhiều bạn mới.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19d-a14","lv":"a","src":"doc","zh":"你今天穿得太少了，外面风很大，最好回家换一件厚一点儿的外套。","py":"Nǐ jīntiān chuān de tài shǎo le, wàimian fēng hěn dà, zuì hǎo huí jiā huàn yí jiàn hòu yìdiǎnr de wàitào.","vi":"Hôm nay bạn mặc ít quá, bên ngoài gió rất lớn, tốt nhất về nhà thay chiếc áo khoác dày hơn.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19d-a15","lv":"a","src":"doc","zh":"这道题对刚开始学习汉语的人来说太难了，老师决定再讲一遍。","py":"Zhè dào tí duì gāng kāishǐ xuéxí Hànyǔ de rén lái shuō tài nán le, lǎoshī juédìng zài jiǎng yí biàn.","vi":"Bài này quá khó đối với người mới bắt đầu học tiếng Trung, giáo viên quyết định giảng lại một lượt.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19d-a16","lv":"a","src":"doc","zh":"你帮我准备了这么多资料，真是太感谢你了。","py":"Nǐ bāng wǒ zhǔnbèi le zhème duō zīliào, zhēn shì tài gǎnxiè nǐ le.","vi":"Bạn đã giúp tôi chuẩn bị nhiều tài liệu như vậy, tôi thật sự cảm ơn bạn rất nhiều.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19d-a17","lv":"a","src":"doc","zh":"这条路晚上太黑了，一个人走不太安全，我们还是一起回去吧。","py":"Zhè tiáo lù wǎnshang tài hēi le, yí ge rén zǒu bú tài ānquán, wǒmen háishi yìqǐ huíqu ba.","vi":"Con đường này buổi tối tối quá, đi một mình không an toàn lắm, chúng ta vẫn nên cùng về.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19d-a18","lv":"a","src":"doc","zh":"最近工作太忙了，我已经两个星期没有跟家里人好好聊天了。","py":"Zuìjìn gōngzuò tài máng le, wǒ yǐjīng liǎng ge xīngqī méiyǒu gēn jiālǐ rén hǎohāo liáotiān le.","vi":"Gần đây công việc bận quá, tôi đã hai tuần không trò chuyện tử tế với người nhà.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19d-a19","lv":"a","src":"doc","zh":"这部电影太长了，不过故事很精彩，所以我们一直看到最后。","py":"Zhè bù diànyǐng tài cháng le, búguò gùshi hěn jīngcǎi, suǒyǐ wǒmen yìzhí kàn dào zuìhòu.","vi":"Bộ phim này dài quá, nhưng câu chuyện rất hấp dẫn nên chúng tôi xem đến tận cuối.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"b19d-a20","lv":"a","src":"doc","zh":"你说得太快了，我有几个地方没听懂，能不能请你慢一点儿再说一次？","py":"Nǐ shuō de tài kuài le, wǒ yǒu jǐ ge dìfang méi tīng dǒng, néng bu néng qǐng nǐ màn yìdiǎnr zài shuō yí cì?","vi":"Bạn nói nhanh quá, có vài chỗ tôi chưa nghe hiểu, có thể nhờ bạn nói chậm hơn một chút thêm lần nữa không?","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"g1","n":11,"lesson":"20","zh":"名词谓语句","vi":"Câu vị ngữ danh từ","use":"Câu có vị ngữ là danh từ, cụm danh từ, số lượng từ hoặc từ chỉ thời gian. Thường dùng để nói ngày tháng, thứ, giờ, tuổi, giá cả, thời tiết, quốc tịch hoặc thân phận.","formula":"S + N/cụm danh từ/số lượng từ/thời gian. Với kiểu câu này thường không đặt 是 trước vị ngữ danh từ. Phủ định thân phận/danh tính: S + 不是 + N.","note":"Không áp dụng máy móc cho mọi câu có danh từ. Khi muốn nhấn mạnh quan hệ \"là\", có thể dùng 是 trong những cấu trúc phù hợp. Ngày tháng theo thứ tự năm–tháng–ngày; 号 thường dùng trong khẩu ngữ, 日 thường gặp trong văn viết.","cmp":false,"ex":[{"id":"g1-b01","lv":"b","src":"doc","zh":"今天星期一。","py":"Jīntiān xīngqīyī.","vi":"Hôm nay là thứ Hai.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g1-b02","lv":"b","src":"doc","zh":"我二十二岁。","py":"Wǒ èrshí'èr suì.","vi":"Tôi 22 tuổi.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g1-b03","lv":"b","src":"doc","zh":"现在八点半。","py":"Xiànzài bā diǎn bàn.","vi":"Bây giờ là 8 giờ rưỡi.","ch":["现在","八点","半"],"fp":"。","ord":true,"alt":[]},{"id":"g1-b04","lv":"b","src":"doc","zh":"今天十月八号。","py":"Jīntiān shí yuè bā hào.","vi":"Hôm nay là ngày 8 tháng 10.","ch":["今天","十月" 明年就是大学生了。","py":"Wǒ dìdi jīnnián shíbā suì, míngnián jiù shì dàxuéshēng le.","vi":"Em trai tôi năm nay 18 tuổi, sang năm sẽ là sinh viên đại học.","ch":["我","弟弟","今年","十八岁，","明年","就","是","大学生了"],"fp":"。","ord":true,"alt":[]},{"id":"g1-a15","lv":"a","src":"doc","zh":"会议时间是星期三下午两点，不是星期四。","py":"Huìyì shíjiān shì xīngqīsān xiàwǔ liǎng diǎn, bú shì xīngqīsì.","vi":"Thời gian cuộc họp là 2 giờ chiều thứ Tư, không phải thứ Năm.","ch":["会议","时间","是","星期三","下午","两点，","不是","星期四"],"fp":"。","ord":true,"alt":[]},{"id":"g1-a16","lv":"a","src":"doc","zh":"我哥哥今年二十五岁，他的女朋友二十四岁。","py":"Wǒ gēge jīnnián èrshíwǔ suì, tā de nǚpéngyou èrshísì suì.","vi":"Anh trai tôi năm nay 25 tuổi, bạn gái anh ấy 24 tuổi.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g1-a17","lv":"a","src":"doc","zh":"今天的天气很好，明天可能是雨天。","py":"Jīntiān de tiānqì hěn hǎo, míngtiān kěnéng shì yǔtiān.","vi":"Thời tiết hôm nay rất đẹp, ngày mai có thể là ngày mưa.","ch":["今天的","天气","很","好，","明天","可能","是","雨天"],"fp":"。","ord":true,"alt":[]},{"id":"g1-a18","lv":"a","src":"doc","zh":"这次考试的时间是九十分钟，大家要认真做题。","py":"Zhè cì kǎoshì de shíjiān shì jiǔshí fēnzhōng, dàjiā yào rènzhēn zuò tí.","vi":"Thời gian bài thi lần này là 90 phút, mọi người cần làm bài nghiêm túc.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g1-a19","lv":"a","src":"doc","zh":"我不是这个公司的职员，我是在附近大学工作的老师。","py":"Wǒ bú shì zhège gōngsī de zhíyuán, wǒ shì zài fùjìn dàxué gōngzuò de lǎoshī.","vi":"Tôi không phải nhân viên công ty này, tôi là giáo viên làm việc ở trường đại học gần đây.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g1-a20","lv":"a","src":"doc","zh":"今天是我来中国学习的第一百天，也是我第一次参加中文比赛的日子。","py":"Jīntiān shì wǒ lái Zhōngguó xuéxí de dì-yìbǎi tiān, yě shì wǒ dì-yī cì cānjiā Zhōngwén bǐsài de rìzi.","vi":"Hôm nay là ngày thứ 100 tôi đến Trung Quốc học tập, cũng là ngày tôi lần đầu tham gia cuộc thi tiếng Trung.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"g2","n":12,"lesson":"21","zh":"时间的表达","vi":"Cách biểu đạt thời gian","use":"Dùng để nói giờ, phút, ngày tháng và sắp xếp thời gian trong câu. Từ chỉ thời gian có thể đứng đầu câu hoặc sau chủ ngữ; khi có cả thời gian và địa điểm, thời gian thường đứng trước địa điểm.","formula":"Giờ: số + 点(钟) + 分; 半 = rưỡi; 一刻 = 15 phút; 差 + số phút + giờ = còn thiếu … phút đến giờ. Ngày tháng: số + 年 + số + 月 + số + 号/日 (văn nói thường dùng 号). Thời gian + chủ ngữ + động từ… hoặc Chủ ngữ + thời gian + động từ…","note":"8:45 có thể nói 八点四十五分 hoặc 差一刻九点. Thứ tự thời gian đi từ đơn vị lớn đến nhỏ. Không đặt trạng ngữ nơi chốn lên trước trạng ngữ thời gian trong mẫu câu được trình bày ở tài liệu. Hai giờ nói 两点 (không nói 二点); mười hai giờ là 十二点.","cmp":false,"ex":[{"id":"g2-b01","lv":"b","src":"doc","zh":"现在九点。","py":"Xiànzài jiǔ diǎn.","vi":"Bây giờ là 9 giờ.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g2-b02","lv":"b","src":"doc","zh":"现在七点半。","py":"Xiànzài qī diǎn bàn.","vi":"Bây giờ là 7 giờ rưỡi.","ch":["现在","七点","半"],"fp":"。","ord":true,"alt":[]},{"id":"g2-b03","lv":"b","src":"doc","zh":"我六点起床。","py":"Wǒ liù diǎn qǐchuáng.","vi":"Tôi thức dậy lúc 6 giờ.","ch":["我","六点","起床"],"fp":"。","ord":true,"alt":[]},{"id":"g2-b04","lv":"b","src":"doc","zh":"我们八点一刻上课。","py":"Wǒmen bā diǎn yí kè shàngkè.","vi":"Chúng tôi vào học lúc 8 giờ 15.","ch":["我们","八点","一刻","上课"],"fp":"。","ord":true,"alt":[]},{"id":"g2-b05","lv":"b","src":"doc","zh":"今天是五月十号。","py":"Jīntiān shì wǔ yuè shí hào.","vi":"Hôm nay là ngày 10 tháng 5.","ch":["今天","是","五月","十号"],"fp":"。","ord":true,"alt":[]},{"id":"g2-b06","lv":"b","src":"doc","zh":"我明天上午有课。","py":"Wǒ míngtiān shàngwǔ yǒu kè.","vi":"Sáng mai tôi có tiết học.","ch":["我","明天","上午","有","课"],"fp":"。","ord":true,"alt":["明天上午我有课。"]},{"id":"g2-b07","lv":"b","src":"doc","zh":"晚上我在宿舍看书。","py":"Wǎnshang wǒ zài sùshè kàn shū.","vi":"Buổi tối tôi đọc sách ở ký túc xá.","ch":["晚上","我","在","宿舍","看","书"],"fp":"。","ord":true,"alt":["我晚上在宿舍看书。"]},{"id":"g2-b08","lv":"b","src":"doc","zh":"去年我在北京学习。","py":"Qùnián wǒ zài Běijīng xuéxí.","vi":"Năm ngoái tôi học ở Bắc Kinh.","ch":["去年","我","在","北京","学习"],"fp":"。","ord":true,"alt":["我去年在北京学习。"]},{"id":"g2-b09","lv":"b","src":"doc","zh":"火车差五分八点开。","py":"Huǒchē chà wǔ fēn bā diǎn kāi.","vi":"Tàu khởi hành lúc 8 giờ kém 5.","ch":["火车","差","五分","八点","开"],"fp":"。","ord":true,"alt":[]},{"id":"g2-b10","lv":"b","src":"doc","zh":"我们星期六下午见面。","py":"Wǒmen xīngqīliù xiàwǔ jiànmiàn.","vi":"Chúng ta gặp nhau chiều thứ Bảy.","ch":["我们","星期六","下午","见面"],"fp":"。","ord":true,"alt":["星期六下午我们见面。"]},{"id":"g2-a11","lv":"a","src":"doc","zh":"我每天早上六点半起床，吃完早饭以后坐地铁去公司。","py":"Wǒ měitiān zǎoshang liù diǎn bàn qǐchuáng, chī wán zǎofàn yǐhòu zuò dìtiě qù gōngsī.","vi":"Mỗi sáng tôi thức dậy lúc 6 giờ rưỡi, ăn sáng xong rồi đi tàu điện ngầm đến công ty.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g2-a12","lv":"a","src":"doc","zh":"昨天晚上十一点多我才回家，因为公司临时有一个重要的会议。","py":"Zuótiān wǎnshang shíyī diǎn duō wǒ cái huí jiā, yīnwèi gōngsī línshí yǒu yí ge zhòngyào de huìyì.","vi":"Tối qua hơn 11 giờ tôi mới về nhà vì công ty đột xuất có một cuộc họp quan trọng.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g2-a13","lv":"a","src":"doc","zh":"我们约好星期日下午三点在图书馆门口见面，你不要迟到。","py":"Wǒmen yuē hǎo xīngqīrì xiàwǔ sān diǎn zài túshūguǎn ménkǒu jiànmiàn, nǐ bú yào chídào.","vi":"Chúng ta hẹn gặp lúc 3 giờ chiều Chủ nhật trước cửa thư viện, bạn đừng đến muộn.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g2-a14","lv":"a","src":"doc","zh":"从下个月一号开始，我每天晚上都要练习一个小时的汉语。","py":"Cóng xià ge yuè yī hào kāishǐ, wǒ měitiān wǎnshang dōu yào liànxí yí ge xiǎoshí de Hànyǔ.","vi":"Bắt đầu từ ngày mùng 1 tháng sau, tối nào tôi cũng phải luyện tiếng Trung một tiếng.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g2-a15","lv":"a","src":"doc","zh":"飞机原定上午九点起飞，但是因为天气不好，推迟到十一点。","py":"Fēijī yuándìng shàngwǔ jiǔ diǎn qǐfēi, dànshì yīnwèi tiānqì bù hǎo, tuīchí dào shíyī diǎn.","vi":"Máy bay dự định cất cánh lúc 9 giờ sáng, nhưng vì thời tiết xấu nên hoãn đến 11 giờ.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g2-a16","lv":"a","src":"doc","zh":"我昨天晚上在宿舍复习到十二点，所以今天早上起得比较晚。","py":"Wǒ zuótiān wǎnshang zài sùshè fùxí dào shí'èr diǎn, suǒyǐ jīntiān zǎoshang qǐ de bǐjiào wǎn.","vi":"Tối qua tôi ôn bài ở ký túc xá đến 12 giờ, vì vậy sáng nay tôi dậy khá muộn.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g2-a17","lv":"a","src":"doc","zh":"这家商店上午九点开门，晚上九点关门，星期天也照常营业。","py":"Zhè jiā shāngdiàn shàngwǔ jiǔ diǎn kāimén, wǎnshang jiǔ diǎn guānmén, xīngqītiān yě zhàocháng yíngyè.","vi":"Cửa hàng này mở cửa lúc 9 giờ sáng, đóng cửa lúc 9 giờ tối và Chủ nhật vẫn kinh doanh bình thường.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g2-a18","lv":"a","src":"doc","zh":"如果你星期五下午有时间，我们可以先吃饭，然后一起去看电影。","py":"Rúguǒ nǐ xīngqīwǔ xiàwǔ yǒu shíjiān, wǒmen kěyǐ xiān chīfàn, ránhòu yìqǐ qù kàn diànyǐng.","vi":"Nếu chiều thứ Sáu bạn có thời gian, chúng ta có thể ăn cơm trước rồi cùng đi xem phim.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g2-a19","lv":"a","src":"doc","zh":"他每天晚上十点以前睡觉，早上五点半起床跑步，已经坚持了半年。","py":"Tā měitiān wǎnshang shí diǎn yǐqián shuìjiào, zǎoshang wǔ diǎn bàn qǐchuáng pǎobù, yǐjīng jiānchí le bàn nián.","vi":"Anh ấy ngủ trước 10 giờ tối, thức dậy lúc 5 giờ rưỡi sáng để chạy bộ và đã duy trì được nửa năm.","ch":[],"fp":"","ord":false,"alt":[]},{"id":"g2-a20","lv":"a","src":"doc","zh":"会议安排在十二月二十日星期三上午九点举行，所有参加的人请提前十分钟到。","py":"Huìyì ānpái zài shí'èr yuè èrshí rì xīngqīsān shàngwǔ jiǔ diǎn jǔxíng, suǒyǒu cānjiā de rén qǐng tíqián shí fēnzhōng dào.","vi":"Cuộc họp được sắp xếp tổ chức lúc 9 giờ sáng thứ Tư ngày 20 tháng 12, tất cả người tham dự vui lòng đến trước 10 phút.","ch":[],"fp":"","ord":false,"alt":[]}]},{"id":"g3","n":13,"lesson":"22","zh":"兼语句","vi":"Câu kiêm ngữ","use":"Dùng khi chủ ngữ nhờ, bảo, yêu cầu hoặc khiến một người thực hiện hành động. Thành phần đứng sau động từ thứ nhất vừa là tân ngữ của động từ đó, vừa là chủ ngữ logic của động từ thứ hai.","formula":"S + 请/叫/让/派 + người (kiêm ngữ) + động từ + tân ngữ/bổ ngữ.","note":"请 thường mang sắc thái mời/yêu cầu lịch sự; 叫 và 让 thường là bảo/khiến/để; 派 là cử/phái. Chọn động từ theo quan hệ và ngữ cảnh, không thay thế tùy tiện.","cmp":false,"ex":[{"id":"g3-b01","lv":"b","src":"doc","zh":"老师叫我回答问题。","py":"Lǎoshī jiào wǒ huídá wèntí.","vi":"Giáo viên bảo tôi trả lời câu hỏi.","ch":["老师","叫","我","回答","问题"],"fp":"。","ord":true,"alt":[]},{"id":"g3-b02","lv":"b","src":"doc","zh":"我请你喝茶。","py":"Wǒ qǐng nǐ hē chá.","vi":"Tôi mời bạn uống trà.","ch":["我","请","你","喝","茶"],"fp":"。","ord":true,"alt":[]},{"id":"g3-b03","lv":"b","src":"doc","zh":"妈妈让我早点儿回家。","py":"Māma ràng wǒ zǎodiǎnr huí jiā.","vi":"Mẹ bảo tôi về nhà sớm một chút.","ch":["妈妈","让","我","早点儿","回","家"],"fp":"。","ord":true,"alt":[]},{"id":"g3-b04","lv":"b","src":"doc","zh":"公司派他去北京。","py":"Gōngsī pài tā qù Běijīng.","vi":"Công ty cử anh ấy đi Bắc Kinh.","ch":["公司","派","他","去","北京"],"fp":"。","ord":true,"alt":[]},{"id":"g3-b05","lv":"b","src":"doc","zh":"老师请大家打开书。","py":"Lǎoshī qǐng dàjiā dǎkāi shū.","vi":"Giáo viên mời mọi người mở sách.","ch":["老师","请","大家","打开","书"],"fp":"。","ord":true,"alt":[]},{"id":"g3-b06","lv":"b","src":"doc","zh":"爸爸叫弟弟去买水果。","py":"Bàba jiào dìdi qù mǎi shuǐguǒ.","vi":"Bố bảo em trai đi mua hoa quả.","ch":["爸爸","叫","弟弟","去","买","水果"],"fp":"。","ord":true,"alt":[]},{"id":"g3-b07","lv":"b","src":"doc","zh":"我想请一个老师教我汉语。","py":"Wǒ xiǎng qǐng yí ge lǎoshī jiāo wǒ Hànyǔ.","vi":"Tôi muốn mời một giáo viên dạy tiếng Trung cho tôi.","ch":["我","想","请","一个","老师","教","我","汉语"],"fp":"。","ord":true,"alt":[]},{"id":"g3-b08","lv":"b","src":"doc","zh":"医生让病人多休息。","py":"Yīshēng ràng bìngrén duō xiūxi.","vi":"Bác sĩ bảo bệnh nhân nghỉ ngơi nhiều.","ch":["医生","让","病人","多","休息"],"fp":"。","ord":true,"alt":[]},{"id":"g3-b09","lv":"b","src":"doc","zh":"经理叫小王来办公室。","py":"Jīnglǐ jiào Xiǎo Wáng lái bàngōngshì.","vi":"Quản lý gọi Tiểu Vương đến văn phòng.","ch":["经理","叫","小王","来","办公室"],"fp":"。","ord":true,"alt":[]},{"id":"g3-b10","lv":"b","src":"doc","zh":"朋友请我们参加生日晚会。","py":"Péngyou qǐng wǒmen cānjiā shēngrì wǎnhuì.","vi":"Bạn bè mời chúng tôi tham gia tiệc sinh nhật.","ch":["朋友","请","我们","参加
